<style>
@font-face { font-family:PublicSans; src:url(fonts/public-sans-400.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:PublicSans; src:url(fonts/public-sans-600.woff2) format('woff2');
             font-weight:600; font-display:swap; }
@font-face { font-family:Garamond; src:url(fonts/eb-garamond-latin-400-normal.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:Garamond; src:url(fonts/eb-garamond-latin-400-italic.woff2) format('woff2');
             font-weight:400; font-style:italic; font-display:swap; }
@font-face { font-family:Caveat; src:url(fonts/caveat-400.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:Caveat; src:url(fonts/caveat-600.woff2) format('woff2');
             font-weight:600; font-display:swap; }
@font-face { font-family:PlexMono; src:url(fonts/plex-mono-400.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:PlexMono; src:url(fonts/plex-mono-500.woff2) format('woff2');
             font-weight:500; font-display:swap; }

/* Every value here is the deck's. It uses exactly one accent and distinguishes
   pipeline stages by icon rather than by colour, so this does the same. */
:root {
  --ink:#F5F3EE;          /* the slide background */
  --slab:#FBFAF6;         /* panels sit a shade above it */
  --slab2:#ECE7DC;        /* marked rows */
  --rule:#C9C5BC;
  --paper:#1F1E1C;        /* the deck's ink */
  --mute:#6B675F;
  --faint:#9C978E;
  --accent:#B8401F;       /* the deck's rust, and the only accent */
  --sans:PublicSans,"Helvetica Neue",Arial,sans-serif;
  --serif:Garamond,Georgia,serif;
  --hand:Caveat,"Brush Script MT",cursive;
  --mono:PlexMono,ui-monospace,Menlo,monospace;
  --pad:22px;
}
* { box-sizing:border-box; }
html { color-scheme:light; }
html,body { background:var(--ink); color:var(--paper); margin:0; }
body { font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
em,i { font-family:var(--serif); font-style:italic; font-size:1.07em; }
.mono { font-family:var(--mono); font-feature-settings:"tnum" 1; }
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-0.5px; }
button,input,textarea,select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
@media (prefers-reduced-motion:reduce) { * { transition:none!important; animation:none!important; } }

/* ── pipeline rail: the table of contents and the architecture diagram at once ── */
.rail { display:flex; align-items:stretch; gap:0; border-bottom:1px solid var(--rule);
        background:var(--slab); position:sticky; top:0; z-index:20; }
.ch { flex:1; display:flex; flex-direction:column; gap:3px; padding:11px 16px 12px;
      background:none; border:0; border-bottom:3px solid transparent; cursor:pointer;
      text-align:left; transition:background .12s; min-width:0; }
.ch:hover { background:var(--slab2); }
.ch .num { font-family:var(--mono); font-size:11.5px; color:var(--mute); }
.ch .nm  { font-size:14.5px; font-weight:600; color:var(--mute); white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
.ch[data-state=done] .nm { color:var(--paper); }
.ch[data-state=done] .num,.ch[data-state=now] .num { color:var(--c); }
.ch[data-state=done] { border-bottom-color:color-mix(in srgb,var(--c) 45%,transparent); }
.ch[data-state=now] { background:var(--slab2); border-bottom-color:var(--c); }
.ch[data-state=now] .nm { color:var(--c); }
.railend { display:flex; align-items:center; gap:14px; padding:0 18px; border-left:1px solid var(--rule);
           font-size:12.5px; color:var(--mute); white-space:nowrap; }

main { padding:26px var(--pad) 90px; max-width:1860px; margin:0 auto; }

/* ── chapter heading ── */
.lede { margin-bottom:12px; max-width:68ch; }
.lede h1 { font-size:31px; line-height:1.18; }

/* ── panels ── */
.panel { background:var(--slab); border:1px solid var(--rule); border-radius:4px;
         padding:var(--pad); margin-bottom:16px; }
.panel > h2 { font-size:17px; margin-bottom:4px; }
.panel > .sub { color:var(--mute); font-size:14px; margin:0 0 16px; max-width:76ch; }
.panel.flush { padding:0; overflow:hidden; }

.grid2 { display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:16px;
         align-items:start; }
.grid2 > :first-child { position:sticky; top:72px; }
@media (max-height:720px) { .grid2 > :first-child { position:static; } }
@media (max-width:1100px) { .grid2 { grid-template-columns:1fr; } }

/* ── controls ── */
.ask { display:flex; gap:10px; margin-bottom:12px; }
.ask input { flex:1; padding:14px 16px; font-size:19px; background:var(--slab);
             border:1px solid var(--rule); border-radius:4px; }
.ask input::placeholder { color:var(--mute); }
.btn { padding:0 22px; font-size:16px; font-weight:600; background:var(--accent); color:#FBFAF6;
       border:0; border-radius:4px; cursor:pointer; }
.btn:disabled { opacity:.45; cursor:default; }
.btn.quiet { background:transparent; color:var(--mute); border:1px solid var(--rule);
             font-weight:400; font-size:14px; padding:7px 13px; }
.btn.quiet:hover { color:var(--paper); border-color:var(--mute); }

.knobs { display:flex; gap:7px 20px; flex-wrap:wrap; align-items:center;
         padding:11px 15px; background:var(--slab); border:1px solid var(--rule);
         border-radius:4px; margin-bottom:16px; font-size:14px; }
.knob { display:flex; gap:7px; align-items:center; color:var(--mute); }
.knob b { color:var(--paper); font-weight:600; }
.knob input,.knob select { width:72px; padding:4px 7px; background:var(--ink);
       border:1px solid var(--rule); border-radius:3px; font-size:14px; font-family:var(--mono); }
.knob select { width:auto; font-family:var(--sans); }
.knob[data-stage] b { color:var(--c); }

/* ── examples ── */
.exrow { display:flex; gap:8px; align-items:flex-start; margin-bottom:7px; }
.exrow .cat { flex:0 0 112px; font-size:13px; color:var(--mute); padding-top:6px; }
.chip { background:var(--slab); border:1px solid var(--rule); border-radius:3px;
        padding:5px 12px; font-size:14px; cursor:pointer; max-width:430px;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip:hover { border-color:var(--paper); }
/* the four that build on each other, numbered so they read as one thread */
.chip.pinned { border-color:var(--accent); }
.chip.pinned i { display:inline-block; font-style:normal; font-family:var(--mono);
                 font-size:11px; color:#FBFAF6; background:var(--accent); border-radius:50%;
                 width:17px; height:17px; line-height:17px; text-align:center;
                 margin-right:8px; vertical-align:1px; }

/* ── latency ── */
.bar { display:grid; grid-template-columns:104px 1fr 92px; gap:12px; align-items:center;
       margin-bottom:7px; font-size:14px; }
.bar .track { background:var(--ink); border-radius:2px; height:22px; overflow:hidden; }
.bar .fill { display:block; height:100%; border-radius:2px; min-width:2px; }
.bar .num { text-align:right; color:var(--mute); }

/* ── analyzer chain ── */
.chainrow { display:grid; grid-template-columns:232px 1fr; gap:14px; align-items:baseline;
            padding:4px 0; border-top:1px solid var(--rule); }
.chainrow:first-child { border-top:0; }
.chainrow .f { color:var(--mute); font-size:13.5px; }
.tok { display:inline-block; padding:2px 9px; margin:2px 4px 2px 0; border-radius:3px;
       background:var(--slab2); font-family:var(--mono); font-size:13.5px; }
.tok.gone { opacity:.32; text-decoration:line-through; }
.tok.new { background:#E4D9CE; }

/* ── tables ── */
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { text-align:right; padding:7px 11px; border-bottom:1px solid var(--rule); }
th:first-child,td:first-child { text-align:left; }
th { color:var(--mute); font-weight:400; font-size:13px; }
tbody tr:hover { background:var(--slab2); }
td.best { color:var(--accent); font-weight:600; }
.scroll { overflow-x:auto; }

/* ── stage columns ── */
.board { display:grid; gap:14px; align-items:start; }
.col { min-width:0; }
.colhead { display:flex; justify-content:space-between; align-items:center; gap:8px;
           padding:0 2px 8px; border-bottom:2px solid var(--paper); margin-bottom:9px; }
.colhead .n { font-size:15px; font-weight:600; color:var(--paper);
              display:flex; align-items:center; gap:8px; }
.colicon { width:26px; height:26px; color:var(--paper); flex:none; }
.colhead .t { font-size:13px; color:var(--mute); font-family:var(--mono); }
.doc { background:var(--ink); border:1px solid var(--rule); border-left:3px solid transparent;
       border-radius:3px; padding:8px 11px; margin-bottom:7px; cursor:pointer; }
.doc:hover { border-color:var(--c); }
.doc.rel { background:var(--slab2); border-left-color:var(--paper); }
.doc.rel .ttl { font-weight:600; }
.doc .top { display:flex; justify-content:space-between; gap:9px; font-size:12.5px;
            color:var(--mute); margin-bottom:3px; font-family:var(--mono); }
.doc .ttl { font-size:14px; line-height:1.38; overflow:hidden; display:-webkit-box;
            -webkit-line-clamp:3; -webkit-box-orient:vertical; }
.doc.rel .ttl::after { content:" ✓"; color:var(--paper); font-weight:600; }
.sc { color:var(--paper); }
.delta { font-weight:600; }
.delta.up { color:var(--accent); } .delta.down { color:var(--faint); }
.tag { font-size:11px; padding:1px 5px; border-radius:2px; border:1px solid var(--rule);
       color:var(--mute); margin-left:5px; font-family:var(--sans); }

/* ── vector strip ── */
.vec { display:flex; align-items:center; gap:1px; height:76px; background:var(--ink);
       border:1px solid var(--rule); border-radius:3px; padding:6px 8px; overflow:hidden; }
.vec i { flex:1 1 0; min-width:0; display:block; border-radius:1px; }

.note { color:var(--mute); font-size:13.5px; margin-top:11px; max-width:80ch; }

.foot { color:var(--mute); font-size:13px; margin:40px 0 8px; text-align:center; }
.foot a { color:inherit; }
.foot .mono { font-size:12px; }

/* ── the shared visual vocabulary ──────────────────────────────────────── */
.sprite { position:absolute; width:0; height:0; overflow:hidden; }
.pipe { width:100%; max-width:860px; margin:0 0 22px; display:block; }
.pipe text { font-family:var(--hand); fill:var(--paper); font-size:22px; }
.pipe .wire { stroke:var(--paper); stroke-width:3; fill:none; }
.pipe .stepno circle { fill:var(--ink); stroke:var(--paper); stroke-width:1.6; }
.pipe .stepno text { font-family:var(--mono); font-size:13px; text-anchor:middle; }

/* step panels: numbered and named after the diagram's nodes */
.stephead { display:inline-flex; align-items:center; gap:10px; }
.stepn { display:inline-grid; place-items:center; width:23px; height:23px; flex:none;
         border-radius:50%; border:1.6px solid var(--paper); font-family:var(--mono);
         font-size:12.5px; font-weight:500; }
.stephead .node { font-family:var(--hand); font-size:24px; font-weight:400; letter-spacing:0; }
.stephead .what { color:var(--mute); font-weight:400; font-size:15px; }
.panel.done summary { display:flex; align-items:center; gap:14px; flex-wrap:wrap;
                      list-style:none; }
.panel.done summary::-webkit-details-marker { display:none; }
.panel.done summary::before { content:'▸'; color:var(--mute); width:10px; }
.panel.done details[open] > summary::before { content:'▾'; }
.panel.done summary .stephead .node { font-size:21px; color:var(--paper); }
.eq { font-family:var(--mono); font-size:13px; color:var(--paper); margin:0 0 14px;
      overflow-x:auto; white-space:nowrap; }

/* small explainer diagrams, always the same shape and size */
.figs { display:flex; gap:14px; flex-wrap:wrap; }
.fig { background:var(--ink); border:1px solid var(--rule); border-radius:4px;
       padding:12px 14px 10px; flex:0 1 340px; min-width:260px; max-width:420px; }
.fig.wide { flex:0 1 480px; max-width:560px; }
.fig h3 { font-size:14px; margin:0 0 2px; }
.fig .formula { font-family:var(--mono); font-size:11.5px; color:var(--mute);
                margin:0 0 9px; line-height:1.45; }
.fig svg { width:100%; height:auto; display:block; }
.fig .cap { font-size:12.5px; color:var(--mute); margin:8px 0 0; }
.fig .cap b { color:var(--paper); font-family:var(--mono); font-weight:500; }
.fig .axis { stroke:var(--rule); stroke-width:1.2; fill:none; }
.fig .curve { fill:none; stroke:var(--c,var(--paper)); stroke-width:2.2; }
.fig .tick { font-family:var(--mono); font-size:10.5px; fill:var(--mute); }
.fig .mark { fill:var(--accent); }
.fig .marklbl { font-family:var(--mono); font-size:11px; fill:var(--paper); }
.fig .ghost { fill:none; stroke:var(--rule); stroke-width:1.6; stroke-dasharray:3 3; }
.banner { background:var(--slab2); border:1px solid var(--rule); border-left:3px solid var(--paper);
          padding:11px 15px; border-radius:3px; font-size:14.5px; margin-bottom:16px; }
.banner.bad { border-left-color:#C0392B; }
pre { background:var(--ink); border:1px solid var(--rule); border-radius:3px; padding:13px;
      overflow:auto; font-size:13px; font-family:var(--mono); max-height:440px; margin:0; }
details > summary { cursor:pointer; color:var(--mute); font-size:14px; padding:4px 0; }
textarea { width:100%; min-height:168px; padding:13px; background:var(--ink);
           border:1px solid var(--rule); border-radius:3px; font-family:var(--mono);
           font-size:14px; line-height:1.5; resize:vertical; }
.kv { display:flex; flex-wrap:wrap; gap:4px 30px; font-size:14px; }
.kv div { display:flex; gap:8px; }
.kv span { color:var(--mute); }
.kv b { font-family:var(--mono); font-weight:500; }
.keys { position:fixed; right:14px; bottom:12px; font-size:12px; color:var(--mute);
        background:var(--slab); border:1px solid var(--rule); border-radius:3px;
        padding:5px 11px; font-family:var(--mono); opacity:.55; pointer-events:none; }
.keys:hover { opacity:1; }
</style>
</head>

    <path d="M 20 20 C 20 8 76 8 76 20 C 76 32 20 32 20 20 Z" stroke="currentColor"></path>
    <path d="M 20 20 Q 19 50 20 78 M 76 20 Q 77 50 76 78 M 20 78 C 20 90 76 90 76 78" stroke="currentColor"></path>
    <path d="M 20 40 C 20 52 76 52 76 40" stroke="currentColor"></path>
    <path d="M 20 59 C 20 71 76 71 76 59" stroke="#B8401F"></path>
  </symbol>
  <symbol id="i-indexing" viewBox="0 0 96 96" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 20 54 C 20 43 76 43 76 54 C 76 65 20 65 20 54 Z" stroke="currentColor"></path>
    <path d="M 20 54 Q 19 68 20 81 M 76 54 Q 77 68 76 81 M 20 81 C 20 92 76 92 76 81" stroke="currentColor"></path>
    <path d="M 48 6 Q 46 22 48 37" stroke="#B8401F"></path>

</defs></svg>

<nav class="rail" id="rail"></nav>

<main>
  <div class="lede"><h1 id="chTitle"></h1></div>
  <div id="chThesis"></div>
  <div id="msg"></div>
  <div id="stage"></div>
  <footer class="foot">built with ❤️ in 🇨🇭 by
    <a href="https://github.com/lukasredev" target="_blank" rel="noopener">lukasredev</a><span
    id="commit"></span></footer>
</main>

<div class="keys">← → chapters &nbsp; 0-5 jump &nbsp; / search</div>

<script>
const API = location.port === '5173' ? 'http://localhost:8080' : '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* The deck draws its whole multi-stage pipeline in one ink colour and lets the icons
   do the distinguishing. Same here: hue is not an encoding, the icon is. */
const HUE = { bm25:'var(--paper)', dense:'var(--paper)', rrf:'var(--paper)',
              rerank:'var(--paper)', analyze:'var(--mute)' };
const ICON = { bm25:'i-inverted', dense:'i-vector', rrf:'i-fuse', rerank:'i-rerank' };
const TITLE = { bm25:'BM25', dense:'Dense', rrf:'RRF fusion', rerank:'Cross-encoder' };

/* Each chapter runs the request it describes, so its latency bar is honest:
   chapter 1 really does only BM25 and really does take 2 ms. */
const CHAPTERS = [
  { id:'index', name:'Indexing', hue:'var(--mute)',
    title:'How one document gets into the index',
    pipe:() => pipeIndex() },
  { id:'lexical', name:'Matching words', hue:'var(--paper)',
    title:'Looking the words up',
    pipe:() => pipeSearch(['bm25']),
    req:{ mode:'bm25_only', rerank:false }, cols:['bm25'], knobs:['k1','b','n'] },
  { id:'semantic', name:'Matching meaning', hue:'var(--paper)',
    title:'Words are not meanings',
    pipe:() => pipeSearch(['bm25','dense']),
    req:{ mode:'hybrid', rerank:false }, cols:['bm25','dense'], knobs:['k1','b','n','ef_search'] },
  { id:'fusion', name:'Combining', hue:'var(--paper)',
    title:'Two rankings, one answer',
    pipe:() => pipeSearch(['bm25','dense','rrf']),
    req:{ mode:'hybrid', rerank:false }, cols:['bm25','dense','rrf'],
    knobs:['k1','b','n','ef_search','rrf_k'] },
  { id:'rerank', name:'Reading closely', hue:'var(--paper)',
    title:'Reading costs more than matching',
    pipe:() => pipeSearch(['bm25','dense','rrf','rerank']),
    req:{ mode:'hybrid', rerank:true }, cols:['bm25','dense','rrf','rerank'],
    knobs:['k1','b','n','ef_search','rrf_k','rerank_n'] },
  { id:'evidence', name:'Was it worth it?', hue:'var(--paper)',
    title:'Did each stage earn its place?',
    pipe:() => pipeSearch(['bm25','dense','rrf','rerank']),
    req:{ mode:'hybrid', rerank:true }, cols:['bm25','dense','rrf','rerank'],
    knobs:['k1','b','n','ef_search','rrf_k','rerank_n'] },
];

const state = {
  ch: 0, health:null, last:null, demos:null, stats:null, busy:false,
  q:'', knob:{ k1:1.2, b:0.75, n:100, ef_search:100, rrf_k:60, rerank_n:50 },
  docText:'', preview:null,
};

/* ══ chrome ══════════════════════════════════════════════════════════════ */
function drawRail() {
  $('rail').innerHTML = CHAPTERS.map((c,i) => {
    const st = i === state.ch ? 'now' : i < state.ch ? 'done' : 'todo';
    return `<button class="ch" data-i="${i}" data-state="${st}" style="--c:${c.hue}">
      <span class="num">${i}</span><span class="nm">${esc(c.name)}</span></button>`;
  }).join('') + `<div class="railend" id="railend"></div>`;
  document.querySelectorAll('.ch').forEach(b => b.onclick = () => go(+b.dataset.i));
  drawRailEnd();
}
/* The commit the running image was built from, linked to it on GitHub. */
function drawCommit() {
  const sha = state.health?.commit;
  $('commit').innerHTML = sha ? ` &middot; <a class="mono" target="_blank" rel="noopener"
    href="https://github.com/lukasredev/search/commit/${encodeURIComponent(sha)}">${
    esc(sha.slice(0, 7))}</a>` : '';
}
function drawRailEnd() {
  const h = state.health;
  const bits = h
    ? [`${h.docs.toLocaleString()} documents`, h.dataset, h.nlp?.ok ? '' : 'models offline']
    : ['connecting'];
  $('railend').innerHTML = bits.filter(Boolean).map(esc).join(' &nbsp; ');
}
function note(text, bad) {
  $('msg').innerHTML = `<div class="banner${bad?' bad':''}">${esc(text)}</div>`;
}

function go(i) {
  state.ch = Math.max(0, Math.min(CHAPTERS.length - 1, i));
  history.replaceState(null, '', `#${CHAPTERS[state.ch].id}`);
  drawRail();
  const c = CHAPTERS[state.ch];
  $('chTitle').textContent = c.title;
  // Search chapters draw their diagram under the results instead (pipelineHtml).
  $('chThesis').innerHTML = state.ch === 0 ? c.pipe() : '';
  $('msg').innerHTML = '';
  render();
  if (state.ch > 0 && state.q) search();
}

/* ══ chapter 0: indexing ════════════════════════════════════════════════ */
function renderIndexing() {
  const p = state.preview;
  $('stage').innerHTML = `
    <div class="grid2">
      <div class="panel">
        <h2>The document</h2>
        <p class="sub">Anything you type here is run through the real analyzer and the real
          embedding model. Nothing is written to the index.</p>
        <textarea id="docText" spellcheck="false">${esc(state.docText)}</textarea>
        <div style="display:flex;gap:9px;margin-top:11px">
          <button class="btn" id="doIndex">Index it</button>
          <button class="btn quiet" id="loadDoc">Load one from the corpus</button>
        </div>
      </div>
      <div id="idxOut">${p ? '' : `<div class="panel"><p class="sub" style="margin:0">
        Press <b>Index it</b> to follow the document through.</p></div>`}</div>
    </div>
    ${statsPanel()}`;

  $('doIndex').onclick = runPreview;
  $('loadDoc').onclick = loadCorpusDoc;
  $('docText').oninput = e => state.docText = e.target.value;
  if (p) drawPreview(p);
}

async function runPreview() {
  const text = $('docText').value.trim();
  if (!text) return;
  state.docText = text;
  $('doIndex').disabled = true;
  try {
    const r = await fetch(`${API}/api/index-preview`, {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text }) });
    if (!r.ok) throw new Error((await r.text()).slice(0, 200));
    state.preview = await r.json();
    drawPreview(state.preview);
  } catch (e) { note('Could not reach the index: ' + e.message, true); }
  finally { $('doIndex').disabled = false; }
}

function drawPreview(p) {
  const s = p.summary;
  const chain = chainRows(p.analyzer.chain, false);

  const rows = p.postings.slice(0, 18).map(t => `<tr>
      <td class="mono">${esc(t.term)}${t.df === 0 ? '<span class="tag">new term</span>' : ''}</td>
      <td class="mono">${t.tf}</td>
      <td class="mono" style="color:var(--mute)">${t.positions.slice(0,8).join(' ')}${
        t.positions.length > 8 ? ' …' : ''}</td>
      <td class="mono">${t.df.toLocaleString()}</td>
      <td class="mono">${t.idf}</td></tr>`).join('');

  const v = p.vector;
  const vecHtml = v && v.values ? `
    <div class="vec">${v.values.map(x => {
      const h = Math.min(100, Math.abs(x) * 420);
      return `<i style="height:${h}%;background:${x >= 0 ? 'var(--accent)' : 'var(--paper)'};
              opacity:${0.5 + Math.min(0.5, Math.abs(x) * 5)}"></i>`;
    }).join('')}</div>
    <div class="kv" style="margin-top:11px">
      <div><span>model</span><b>${esc(v.model.split('/').pop())}</b></div>
      <div><span>dimensions</span><b>${v.dim}</b></div>
      <div><span>length</span><b>${v.norm}</b></div>
      <div><span>size</span><b>${v.bytes} bytes</b></div>
      <div><span>computed in</span><b>${v.ms} ms</b></div>
    </div>
    <p class="note">Every document in the index is one of these.</p>`
    : `<p class="sub">The embedding model is not reachable, so only the word half ran.</p>`;

  $('idxOut').innerHTML = `
    <div class="panel">
      <h2>1 &nbsp;Split it into terms</h2>
      ${chain}
      <p class="note">Only what survives every step is searchable. That is why “deficiencies” and
        “deficiency” end up as the same entry.</p>
    </div>
    <div class="panel">
      <h2>2 &nbsp;Add it to the inverted index</h2>
      <p class="sub">Every row below is one <b>posting</b>: this term, in this document,
        this many times, at these positions. Collect the postings for a term across the
        whole collection and you have its <b>posting list</b> — which is what a search
        for that term actually fetches.</p>
      <div class="figs" style="margin-bottom:14px">${
        p.postings.length ? figIdf(p.postings.slice(0,12), s.docsInIndex) : ''}</div>
      <div class="scroll"><table>
        <thead><tr><th>term</th><th>times here</th><th>at positions</th>
          <th>documents already</th><th>idf</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${p.postings.length > 18 ? `<p class="note">${p.postings.length - 18} more terms not shown.</p>` : ''}
      <div class="kv" style="margin-top:14px">
        <div><span>tokens</span><b>${s.tokensProduced}</b></div>
        <div><span>distinct terms</span><b>${s.uniqueTerms}</b></div>
        <div><span>never seen before</span><b>${s.termsNewToThisIndex}</b></div>
        <div><span>index size</span><b>${s.docsInIndex.toLocaleString()} docs</b></div>
      </div>
    </div>
    <div class="panel">
      <h2>3 &nbsp;Turn it into a point in space</h2>
      <p class="sub">${v?.dim ?? 384} numbers — one bar each, height for size, colour for sign.</p>
      ${vecHtml}
    </div>`;
}

/* Lucene's class names are library trivia; what a step *does* is the lesson. The real
   names stay available under "every filter, step by step" for anyone mapping this to code. */
const FILTER_LABEL = {
  StandardTokenizer:       'split on spaces and punctuation',
  EnglishPossessiveFilter: 'strip possessives',
  LowerCaseFilter:         'lowercase',
  StopFilter:              'drop very common words',
  PorterStemFilter:        'reduce to word stems',
};

/* Steps that changed nothing are hidden: EnglishPossessiveFilter is a no-op on almost
   every input, and an identical repeated row makes the process look longer than it is. */
function chainRows(chain, showAll) {
  return chain.map((step, i) => {
    const prev = i ? chain[i-1].tokens : null;
    const changed = !prev || step.tokens.join('\u0000') !== prev.join('\u0000');
    if (!changed && !showAll) return '';
    const label = showAll ? step.filter : (FILTER_LABEL[step.filter] || step.filter);
    const toks = step.tokens.map(t => `<span class="tok">${esc(t)}</span>`).join('');
    const gone = prev ? prev.filter(x => !step.tokens.includes(x) && !stemmedFrom(x, step.tokens))
      .map(t => `<span class="tok gone">${esc(t)}</span>`).join('') : '';
    return `<div class="chainrow"><span class="f${showAll ? ' mono' : ''}">${esc(label)}</span>
            <span>${toks}${gone}</span></div>`;
  }).join('');
}

function stemmedFrom(word, tokens) {
  return tokens.some(t => word.toLowerCase().startsWith(t.slice(0, Math.max(3, t.length - 2))));
}

function statsPanel() {
  const s = state.stats;
  if (!s || !s.bytesByComponent) return '';
  const parts = Object.entries(s.bytesByComponent).filter(([,b]) => b > 1000)
    .sort((a,b) => b[1] - a[1]);
  const max = parts[0][1];
  const hnsw = s.bytesByComponent['hnsw vectors'];
  const inv = s.bytesByComponent['inverted index'];
  const ratio = hnsw && inv
    ? `Storing meaning costs <b>${(hnsw/inv).toFixed(0)}&times;</b> what storing words does:
       ${(hnsw/1e6).toFixed(0)} MB of vectors against ${(inv/1e6).toFixed(1)} MB of postings.`
    : 'The word index is the cheap half.';
  return `<div class="panel">
    <h2>What the finished index costs</h2>
    <p class="sub">${s.docs.toLocaleString()} documents and ${s.uniqueTerms.toLocaleString()}
      distinct terms, on disk. ${ratio}</p>
    ${parts.map(([k,b]) => `<div class="bar">
      <span>${esc(k)}</span>
      <span class="track"><span class="fill" style="width:${100*b/max}%;background:${
        k.includes('hnsw') ? 'var(--accent)' : k.includes('inverted') ? 'var(--paper)' : 'var(--faint)'
      }"></span></span>
      <span class="num mono">${(b/1e6).toFixed(1)} MB</span></div>`).join('')}
  </div>`;
}

async function loadCorpusDoc() {
  try {
    const qs = await (await fetch(`${API}/api/queries?limit=80`)).json();
    const pick = qs.queries[Math.floor(Math.random() * qs.queries.length)];
    const r = await (await fetch(
      `${API}/api/search?mode=bm25_only&rerank=false&explain=false&bm25_n=1&q=${
        encodeURIComponent(pick.text)}`)).json();
    const id = r.stages.find(s => s.name === 'bm25')?.results?.[0]?.docId;
    if (!id) return;
    const doc = await (await fetch(`${API}/api/doc/${encodeURIComponent(id)}`)).json();
    state.docText = [doc.title, doc.text].filter(Boolean).join('\n\n');
    $('docText').value = state.docText;
    runPreview();
  } catch (e) { note('Could not load a document: ' + e.message, true); }
}

/* ══ chapters 1-5: searching ════════════════════════════════════════════ */
function renderSearch() {
  const c = CHAPTERS[state.ch];
  $('stage').innerHTML = `
    <div class="ask">
      <input id="q" type="text" value="${esc(state.q)}" spellcheck="false"
             placeholder="Ask something, or pick an example below">
      <button class="btn" id="go">Search</button>
    </div>
    <div id="examples"></div>
    <div id="results"></div>`;

  $('go').onclick = search;
  $('q').onkeydown = e => { if (e.key === 'Enter') { state.q = $('q').value; search(); } };
  $('q').oninput = e => state.q = e.target.value;
  drawExamples();
  if (state.last) drawResults();
  else { $('results').innerHTML = pipelineHtml(c); bindKnobs(c); }
}

/* The chapter's diagram and its knobs. Before a search they sit under the query; after
   one they move below the results, so the ranking is the first thing on screen. */
function pipelineHtml(c) {
  return `<div class="panel"><h2>Where this happens in the pipeline</h2>${c.pipe()}</div>
    ${knobsHtml(c)}`;
}
function bindKnobs(c) {
  c.knobs.forEach(k => {
    const el = $('k_' + k);
    if (el) el.onchange = () => { state.knob[k] = el.value; if (state.last) search(); };
  });
}

const KNOB_META = {
  k1:{ label:'k1', stage:'bm25', step:0.1, hint:'how fast repeated words stop helping' },
  b:{ label:'b', stage:'bm25', step:0.05, hint:'how much document length is penalised' },
  n:{ label:'candidates', stage:null, step:10 },
  ef_search:{ label:'efSearch', stage:'dense', step:10, hint:'how wide the graph walk is' },
  rrf_k:{ label:'k', stage:'rrf', step:10, hint:'how much top ranks dominate' },
  rerank_n:{ label:'rerank top', stage:'rerank', step:10 },
};
function knobsHtml(c) {
  return `<div class="knobs">${c.knobs.map(k => {
    const m = KNOB_META[k];
    const hue = m.stage ? HUE[m.stage] : 'var(--paper)';
    return `<span class="knob" ${m.stage?`data-stage="${m.stage}"`:''} style="--c:${hue}"
      ${m.hint?`title="${esc(m.hint)}"`:''}><b>${esc(m.label)}</b>
      <input id="k_${k}" type="number" step="${m.step}" value="${state.knob[k]}"></span>`;
  }).join('')}</div>`;
}

function drawExamples() {
  const d = state.demos;
  if (!d) return;
  const CAT = {
    'lexical-win':  'words win',
    'semantic-win': 'meaning wins',
    'fusion-win':   'fusion wins',
    'rerank-win':   'reading wins',
  };
  // A row appears only once its chapter has introduced the stage it is about, so the
  // four pinned queries arrive one per chapter, each failing at the stage before it.
  const upto = { 1:1, 2:2, 3:3, 4:4, 5:4 }[state.ch] || 1;
  const show = Object.keys(CAT).slice(0, upto);

  $('examples').innerHTML = show.filter(k => d[k]?.length).map(k => `
    <div class="exrow"><span class="cat">${CAT[k]}</span>
      ${d[k].slice(0, 3).map(r => `<span class="chip${r.ladder ? ' pinned' : ''}"
        data-q="${esc(r.text)}" title="${esc(r.teaches || '')}"
        >${r.ladder ? `<i>${esc(r.ladder)}</i>` : ''}${esc(r.text)}</span>`).join('')}
    </div>`).join('');

  document.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    state.q = el.dataset.q; $('q').value = state.q; search();
  });
}

async function search() {
  const c = CHAPTERS[state.ch];
  state.q = ($('q')?.value || state.q).trim();
  if (!state.q || state.busy) return;
  state.busy = true; $('go').disabled = true; $('msg').innerHTML = '';

  const p = new URLSearchParams({
    q: state.q, mode: c.req.mode, rerank: c.req.rerank,
    k1: state.knob.k1, b: state.knob.b,
    bm25_n: state.knob.n, dense_n: state.knob.n,
    ef_search: state.knob.ef_search, rrf_k: state.knob.rrf_k,
    rerank_n: c.req.rerank ? state.knob.rerank_n : 0,
  });
  try {
    const res = await fetch(`${API}/api/search?${p}`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    state.last = await res.json();
    if (state.last.warnings) note(state.last.warnings.join(' · '));
    drawResults();
  } catch (e) { note('Search failed: ' + e.message, true); }
  finally { state.busy = false; const g = $('go'); if (g) g.disabled = false; }
}

function drawResults() {
  const d = state.last, c = CHAPTERS[state.ch];
  const st = Object.fromEntries(d.stages.map(s => [s.name, s]));
  const cols = c.cols.filter(n => st[n]?.results?.length);

  // Results first, straight under the query, then the diagram, then one panel per
  // numbered step of the diagram in the same order.
  const blocks = [boardPanel(cols, st, d, c), pipelineHtml(c)];
  STEPS.filter(s => c.cols.includes(s.stage) && st[s.stage])
    .forEach(s => blocks.push(s.panel(st, d, s, s.from === state.ch)));
  if (state.ch === 5) blocks.push(evalPanel(d.eval));
  blocks.push(latencyPanel(d.stages));
  if (state.ch === 5) blocks.push(benchPanel());

  $('results').innerHTML = blocks.filter(Boolean).join('');
  bindKnobs(c);
  document.querySelectorAll('.doc').forEach(el =>
    el.onclick = () => showDoc(el.dataset.id, d, st));
}

/* ══ the numbered steps ═════════════════════════════════════════════════
   One panel per numbered disc on the diagram, in the diagram's order. A step is
   open in the chapter that introduces it and folded to one line after that. */
const STEPS = [
  { n:1, stage:'bm25', from:1, nodes:'terms', what:'what the word index searched for',
    panel:termsStep },
  { n:2, stage:'bm25', from:1, nodes:'inverted index → BM25 ranks',
    what:'scoring documents by their words', panel:bm25Step },
  { n:3, stage:'dense', from:2, nodes:'embedding → nearest vectors',
    what:'scoring documents by meaning', panel:denseStep },
  { n:4, stage:'rrf', from:3, nodes:'fuse', what:'two rankings into one', panel:rrfStep },
  { n:5, stage:'rerank', from:4, nodes:'read closely → answer',
    what:'a slower model rereads the shortlist', panel:rerankStep },
];

function stepPanel(s, open, oneLine, body) {
  const head = `<span class="stephead"><span class="stepn">${s.n}</span>
    <span class="node">${s.nodes}</span>`;
  if (open) return `<div class="panel">
    <h2>${head}<span class="what">${s.what}</span></span></h2>${body}</div>`;
  return `<div class="panel done"><details><summary>${head}</span>
    <span>${oneLine}</span></summary><div style="margin-top:14px">${body}</div></details></div>`;
}

function termsStep(st, d, s, open) {
  const a = st.analyze;
  if (!a) return '';
  const last = a.detail.chain[a.detail.chain.length - 1];
  const dense = !!st.dense;
  return stepPanel(s, open, `${last.tokens.length} term${last.tokens.length === 1 ? '' : 's'}:
      <span class="mono">${last.tokens.map(esc).join(' ')}</span>`, `
    <p class="sub">Your words go through the same analyzer every document went through when it
      was indexed &mdash; split, lowercased, common words dropped, cut down to stems &mdash;
      so query and documents meet on the same terms.${dense ? ` The embedding model in step 3
      does not use these: it is given your words exactly as typed.` : ''}</p>
    <div>${last.tokens.map(t => `<span class="tok">${esc(t)}</span>`).join('')}</div>
    <details style="margin-top:10px"><summary>Every step, with its Lucene class name</summary>
      <div style="margin-top:8px">${chainRows(a.detail.chain, true)}</div></details>`);
}

function bm25Step(st, d, s, open) {
  const terms = st.analyze?.detail.terms || [];
  const k1 = Number(d.params.k1), b = Number(d.params.b);
  const bm = st.bm25;
  return stepPanel(s, open, `${bm.results.length} documents ranked in ${bm.ms} ms`, `
    <p class="sub">Each term is looked up in the inverted index, which lists every document
      that contains it. For each term a document contains, it gets the term's rarity
      (<b>idf</b>) times a share of it that grows with how often the term appears there
      (<b>tf</b>) and shrinks if the document is longer than average. The score is the sum
      over the query's terms.</p>
    <p class="eq">score = &Sigma;<sub>terms</sub> idf &times; tf / (tf + k1 &times; (1 &minus; b + b &times; len/avg))</p>
    <div class="scroll"><table>
      <thead><tr><th>term</th><th>documents containing it</th><th>idf</th></tr></thead>
      <tbody>${terms.map(t => `<tr><td class="mono">${esc(t.term)}</td>
        <td class="mono">${t.df.toLocaleString()}</td><td class="mono">${t.idf}</td></tr>`).join('')}
      </tbody></table></div>
    <div class="figs" style="margin-top:14px">
      ${terms.length ? figIdf(terms, state.health?.docs || 1) : ''}
      ${figSaturation(k1, b)}
      ${figLength(k1, b)}
    </div>
    <p class="note">Change <b>k1</b> or <b>b</b> above to move the curves. Click a result to
      see this sum worked out for that document.</p>`);
}

function denseStep(st, d, s, open) {
  const dense = st.dense, dd = dense.detail;
  const lex = new Set((st.bm25?.results || []).map(r => r.docId));
  const onlyDense = dense.results.filter(r => !lex.has(r.docId)).length;
  const missed = !st.bm25 ? ''
    : onlyDense === 0 ? `All ${dense.results.length} of these are in BM25's list too.`
    : `${onlyDense} of these ${dense.results.length} are not in BM25's top
       ${st.bm25.results.length} at all: word matching alone would have missed them.`;
  return stepPanel(s, open, `visited ${dd.visitedFraction}% of the vectors in ${dense.ms} ms`, `
    <p class="sub">Your words go to the embedding model as typed and come back as one vector,
      a point in the same space every document was put into when it was indexed. The vector
      index (an HNSW graph) then walks from neighbour to neighbour towards the documents that
      point most nearly the same way, without comparing against all of them.</p>
    <div class="figs" style="margin-bottom:14px">${figCosine(dense.results[0]?.score ?? 0.8)}</div>
    <div class="kv">
      <div><span>embedding the query</span><b>${dd.embedMs} ms</b></div>
      <div><span>walking the graph</span><b>${dd.graphMs} ms</b></div>
      <div><span>vectors visited</span><b>${dd.visitedCount.toLocaleString()}${
        state.health ? ' of ' + state.health.docs.toLocaleString() : ''}</b></div>
      <div><span>that is</span><b>${dd.visitedFraction}%</b></div>
    </div>
    ${missed ? `<p class="note">${missed}</p>` : ''}`);
}

function rrfStep(st, d, s, open) {
  const rrf = st.rrf, k = Number(rrf.params.k), top = rrf.results[0];
  const rows = rrf.results.slice(0, 8).map(r => `<tr>
      <td class="mono">${r.rank}</td>
      <td style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${
        esc((d.docs[r.docId]||{}).title || r.docId)}</td>
      <td class="mono">${r.contrib.bm25 ? r.contrib.bm25.rank : '—'}</td>
      <td class="mono" style="color:var(--accent)">${r.contrib.dense ? r.contrib.dense.rank : '—'}</td>
      <td class="mono" style="color:var(--mute);text-align:left">${esc(r.formula)}</td></tr>`).join('');
  return stepPanel(s, open,
    `${rrf.detail.uniqueDocs} documents, ${rrf.detail.overlap} found by both`, `
    <p class="sub">BM25 scores and vector scores are on different scales, so fusion ignores
      the scores and uses only positions: each list gives a document 1 / (k + its rank there),
      and the sums decide the order.</p>
    <div class="figs" style="margin-bottom:14px">${figRrf(k, [
      { rank: top?.contrib?.bm25?.rank, hue: 'var(--paper)', name: 'BM25' },
      { rank: top?.contrib?.dense?.rank, hue: 'var(--accent)', name: 'dense' }],
      st.bm25?.results[0]?.score, st.dense?.results[0]?.score)}</div>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>document</th><th>BM25 rank</th><th>dense rank</th>
        <th style="text-align:left">fused score</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`);
}

function rerankStep(st, d, s, open) {
  const r = st.rerank, res = r.results;
  const moved = res.filter(x => x.delta !== 0).length;
  const big = res.reduce((a, x) => x.delta > (a ? a.delta : 0) ? x : a, null);
  return stepPanel(s, open, `reread ${res.length} documents, moved ${moved}`, `
    <p class="sub">The top ${res.length} of the fused list go to a cross-encoder, which reads
      your words and one document together and gives a single relevance score. It reorders
      those ${res.length}; anything below them keeps its fused order. That is the answer.</p>
    <div class="figs" style="margin-bottom:14px">${figEncoders()}</div>
    <div class="kv">
      <div><span>documents read</span><b>${res.length}</b></div>
      <div><span>time</span><b>${r.ms} ms</b></div>
      <div><span>per document</span><b>${r.detail.msPerDoc} ms</b></div>
      <div><span>changed position</span><b>${moved} of ${res.length}</b></div>
      <div><span>cut at ${r.params.maxLength} tokens</span><b>${r.detail.truncatedDocs}</b></div>
    </div>
    ${big ? `<p class="note">Biggest move: <b>${esc((d.docs[big.docId]||{}).title || big.docId)}</b>,
      from ${big.prevRank} to ${big.rank}.</p>` : ''}`);
}

function latencyPanel(stages) {
  const max = Math.max(...stages.map(s => s.ms), 1);
  const total = stages.reduce((a,s) => a + s.ms, 0);
  const slowest = stages.reduce((a,s) => s.ms > a.ms ? s : a);
  // Per document actually reread: fewer than rerank_n when fusion found fewer.
  const rerank = stages.find(s => s.name === 'rerank' && s.detail?.msPerDoc);
  return `<div class="panel">
    <h2>Where the time went</h2>
    <p class="sub">${total.toFixed(0)} ms in total, ${
      (100*slowest.ms/total).toFixed(0)}% of it in <b>${esc(slowest.name)}</b>.</p>
    ${stages.map(s => `<div class="bar">
      <span class="mono">${esc(s.name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(100*s.ms/max,0.4)}%;
        background:${s.ms === max ? 'var(--accent)' : 'var(--paper)'}"></span></span>
      <span class="num mono">${s.ms} ms</span></div>`).join('')}
    ${state.ch >= 4 && rerank ? `<p class="note">Scoring all ${
      (state.health?.docs || 0).toLocaleString()} documents this way would take
      ${fmtDuration((state.health?.docs||0) * rerank.detail.msPerDoc)}.</p>` : ''}
  </div>`;
}

function boardPanel(cols, st, d, c) {
  const body = cols.map(name => {
    const s = st[name];
    const docs = s.results.slice(0, 12).map(r => docCard(r, d, name)).join('');
    return `<div class="col">
      <div class="colhead"><span class="n"><svg class="colicon" aria-hidden="true"><use
        href="#${ICON[name]}"/></svg>${esc(TITLE[name])}</span>
        <span class="t">${s.ms} ms</span></div>${docs}</div>`;
  }).join('');
  const only = st.rrf ? `<p class="note">Of ${st.rrf.detail.uniqueDocs} documents found in
    total, only ${st.rrf.detail.overlap} were found by <em>both</em> retrievers.</p>` : '';
  const relNote = d.eval?.judged
    ? `<p class="note">✓ marks the documents human judges called relevant.</p>` : '';
  return `<div class="panel">
    <h2>${cols.length === 1 ? 'What came back' : 'The same query, ranked ' + cols.length + ' ways'}</h2>
    <p class="sub">Top 12. Click one to see its score broken down.</p>
    <div class="board" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${body}</div>
    ${only}${relNote}</div>`;
}

function docCard(r, d, stage) {
  const meta = d.docs[r.docId] || {};
  let right = `<span class="sc">${fmtScore(r.score, stage)}</span>`;
  if (stage === 'rerank' && r.delta) {
    right += ` <span class="delta ${r.delta>0?'up':'down'}">${r.delta>0?'▲':'▼'}${
      Math.abs(r.delta)}</span>`;
  }
  const tags = (stage === 'rrf' && r.foundBy?.length === 1)
      ? `<span class="tag">${esc(r.foundBy[0])} only</span>` : '';
  const trunc = (stage === 'rerank' && r.truncated)
      ? `<span class="tag">cut at ${maxTokens(d)}</span>` : '';
  return `<div class="doc${meta.relevance>0?' rel':''}" data-id="${esc(r.docId)}">
    <div class="top"><span>${r.rank}${tags}${trunc}</span>${right}</div>
    <div class="ttl">${esc(meta.title || meta.snippet || '')}</div></div>`;
}
// The cross-encoder's window, as the sidecar reports it (RERANK_MAX_LEN).
const maxTokens = d => d.stages.find(s => s.name === 'rerank')?.params.maxLength ?? 512;
const fmtScore = (v, s) => s === 'rrf' ? v.toFixed(5) : s === 'dense' ? v.toFixed(3) : v.toFixed(2);

function evalPanel(ev) {
  if (!ev || !ev.judged) return `<div class="panel"><h2>No judgments for this query</h2>
    <p class="sub" style="margin:0">Pick one of the examples above — those come with human
    relevance judgments, so every stage can be scored.</p></div>`;
  const metrics = ['ndcg@10','recall@10','recall@100','mrr'];
  const names = { 'ndcg@10':'nDCG@10', 'recall@10':'recall@10', 'recall@100':'recall@100', mrr:'MRR' };
  const stages = Object.keys(ev.perStage);
  const best = {};
  metrics.forEach(m => best[m] = Math.max(...stages.map(s => ev.perStage[s][m])));
  return `<div class="panel">
    <h2>Scoring this query after every stage</h2>
    <p class="sub">${ev.relevantTotal} document${ev.relevantTotal===1?' was':'s were'} judged
      relevant for this query.</p>
    <div class="figs" style="margin-bottom:16px">${figNdcg(relevantPositions())}</div>
    <table><thead><tr><th>after</th>${metrics.map(m=>`<th>${names[m]}</th>`).join('')}</tr></thead>
    <tbody>${stages.map(s => `<tr><td>${esc(TITLE[s]||s)}</td>
      ${metrics.map(m => `<td class="mono ${ev.perStage[s][m]===best[m]&&best[m]>0?'best':''}">${
        ev.perStage[s][m].toFixed(3)}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <p class="note">One query is an anecdote. The table below is all of them.</p>
  </div>`;
}

function benchPanel() {
  const b = state.bench;
  if (!b || !b.perStage) return '';
  const rows = Object.entries(b.perStage).map(([s,m]) => `<tr>
    <td>${esc(TITLE[s]||s)}</td>
    <td class="mono">${(m['ndcg@10']??0).toFixed(3)}</td>
    <td class="mono">${(m['recall@100']??0).toFixed(3)}</td>
    <td class="mono">${(m.mrr??0).toFixed(3)}</td>
    <td class="mono">${m.avgMs} ms</td></tr>`).join('');
  return `<div class="panel">
    <h2>Every judged query in the collection</h2>
    <p class="sub">${b.queries.toLocaleString()} queries, averaged.</p>
    <table><thead><tr><th>after</th><th>nDCG@10</th><th>recall@100</th><th>MRR</th>
      <th>per query</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function showDoc(docId, d, st) {
  const meta = d.docs[docId] || {};
  const out = [];
  const bm = st.bm25?.results.find(r => r.docId === docId);
  if (bm?.explain) {
    out.push(`<h2>Why BM25 scored it ${bm.explain.total}</h2>
      <p class="sub">k1 = ${bm.explain.k1}, b = ${bm.explain.b}. Each term contributes
      independently; they simply add up.</p>
      <div class="scroll"><table><thead><tr><th>term</th><th>contributes</th><th>times in doc</th>
      <th>documents with it</th><th>idf</th><th>doc length</th><th>average</th></tr></thead><tbody>
      ${bm.explain.terms.map(t => `<tr><td class="mono">${esc(t.term)}</td>
        <td class="mono" style="color:var(--accent)">${t.contrib}</td><td class="mono">${t.tf ?? '—'}</td>
        <td class="mono">${(t.df ?? 0).toLocaleString()}</td><td class="mono">${t.idf ?? '—'}</td>
        <td class="mono">${t.dl ?? '—'}</td><td class="mono">${t.avgdl ?? '—'}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  const rr = st.rrf?.results.find(r => r.docId === docId);
  if (rr) out.push(`<p class="note" style="font-size:15px">Fused: <span class="mono">${
    esc(rr.formula)}</span></p>`);
  const rk = st.rerank?.results.find(r => r.docId === docId);
  if (rk) out.push(`<p class="note" style="font-size:15px">Cross-encoder scored it
    <b class="mono">${rk.score}</b> and moved it from ${rk.prevRank} to ${rk.rank}${
    rk.truncated ? `, having read only the first ${maxTokens(d)} tokens of ${rk.docTokens}` : ''}.</p>`);

  const where = ['bm25','dense','rrf','rerank'].filter(n => st[n]).map(n => {
    const r = st[n].results.find(x => x.docId === docId);
    return `<div><span>${esc(TITLE[n])}</span><b>${r?'#'+r.rank:'not found'}</b></div>`;
  }).join('');

  $('msg').innerHTML = `<div class="panel">
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
      <div><h2>${esc(meta.title || docId)}</h2>
        <p class="sub" style="margin:4px 0 0">${esc(docId)}${
          meta.relevance>0 ? ' — judged relevant' : ''}</p></div>
      <button class="btn quiet" onclick="document.getElementById('msg').innerHTML=''">Close</button>
    </div>
    <div class="kv" style="margin:14px 0">${where}</div>
    ${out.join('')}
    <details style="margin-top:12px"><summary>The document</summary>
      <p class="note" style="font-size:14.5px;color:var(--paper)">${esc(meta.snippet||'')}</p></details>
  </div>`;
  $('msg').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

/* ══ shared diagrams ════════════════════════════════════════════════════
   Drawn with the deck's own icons and its ink-only convention: nothing here is
   colour-coded, because the deck's multi-stage slide is not either. A stage that
   has not happened yet is dimmed, never recoloured. */
function node(cx, cy, icon, label, on) {
  return `<g opacity="${on ? 1 : 0.24}">
    <use href="#i-${icon}" x="${cx-26}" y="${cy-26}" width="52" height="52"/>
    <text x="${cx}" y="${cy+46}" text-anchor="middle">${label}</text></g>`;
}
function wire(d, on) {
  return `<path d="${d}" class="wire" opacity="${on ? 1 : 0.22}"
    marker-end="url(#pipearrow)"/>`;
}
const ARROW = `<defs><marker id="pipearrow" orient="auto" markerWidth="8" markerHeight="8"
  refX="7" refY="4" overflow="visible"><path d="M1 1L7 4L1 7" fill="none" stroke="currentColor"
  stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>`;

/* A numbered disc on the diagram; the step panels below the results carry the same
   number, so each explanation can be found on the picture. */
function stepNo(cx, cy, n, on) {
  return `<g class="stepno" opacity="${on ? 1 : 0.24}"><circle cx="${cx}" cy="${cy}" r="10"/>
    <text x="${cx}" y="${cy+4.5}">${n}</text></g>`;
}

/* The search half, matching the deck's multistage slide. Only the BM25 branch goes
   through the analyzer: the embedding model is given the query exactly as typed. */

      and the answer comes out">
    ${ARROW}
    ${wire('M70 105C100 105 100 44 128 44', on('bm25'))}
    ${wire('M70 105C100 105 100 166 240 166', on('dense'))}
    ${wire('M186 44H240', on('bm25'))}
    ${wire('M298 44H354', on('bm25'))}
    ${wire('M298 166H354', on('dense'))}
    ${wire('M412 44C450 44 450 105 468 105', on('rrf'))}
    ${wire('M412 166C450 166 450 105 468 105', on('rrf'))}
    ${wire('M526 105H574', on('rerank'))}
    ${wire('M632 105H680', on('rerank'))}
    ${node(44, 105, 'query', 'your words', true)}
    ${node(160, 44, 'split', 'terms', on('bm25'))}
    ${node(272, 44, 'inverted', 'inverted index', on('bm25'))}
    ${node(386, 44, 'rank', 'BM25 ranks', on('bm25'))}
    ${node(272, 166, 'embedding', 'embedding', on('dense'))}
    ${node(386, 166, 'vector', 'nearest vectors', on('dense'))}
    ${node(500, 105, 'fuse', 'fuse', on('rrf'))}

    ${node(712, 105, 'results', 'answer', true)}
    ${stepNo(186, 16, 1, on('bm25'))}
    ${stepNo(326, 44, 2, on('bm25'))}
    ${stepNo(326, 166, 3, on('dense'))}
    ${stepNo(526, 76, 4, on('rrf'))}

}

/* The indexing half, matching the deck's pipeline slide. */
function pipeIndex() {
  return `<svg class="pipe" viewBox="0 0 760 228" role="img" style="color:var(--paper)"
    aria-label="A document is split, filtered, then written both into the inverted index
      and as an embedding, together making one index">
    ${ARROW}
    ${wire('M86 105H148', true)}
    ${wire('M226 105H288', true)}
    ${wire('M366 105C420 105 420 44 448 44', true)}
    ${wire('M366 105C420 105 420 166 448 166', true)}

/* ══ explainer figures ══════════════════════════════════════════════════
   Each one is drawn from the live numbers on screen, so it explains this query
   rather than a textbook example. Same size, same axes treatment, every time. */
const W = 300, H = 132, L = 36, R = 10, T = 12, B = 26;
const px = t => L + t * (W - L - R);
const py = t => T + (1 - t) * (H - T - B);
const path = pts => pts.map((p,i) => (i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
const axes = () => `<path class="axis" d="M${L} ${T}V${H-B}H${W-R}"/>`;

function figShell(hue, title, formula, body, cap, wide, vb) {
  return `<div class="fig${wide?' wide':''}" style="--c:${hue}">
    <h3>${title}</h3><p class="formula">${formula}</p>
    <svg viewBox="${vb || `0 0 ${W} ${H}`}">${body}</svg>
    <p class="cap">${cap}</p></div>`;
}

/* Why a word in 3 documents counts for more than a word in 200,000. */
function figIdf(terms, numDocs) {
  const idf = df => Math.log(1 + (numDocs - df + 0.5) / (df + 0.5));
  const maxIdf = idf(1), lg = Math.log10(numDocs);
  const X = df => px(Math.log10(Math.max(df,1)) / lg);
  const Y = v => py(v / maxIdf);
  const curve = [];
  for (let i = 0; i <= 60; i++) {
    const df = Math.pow(10, (i/60) * lg);
    curve.push([X(df), Y(idf(df))]);
  }
  const shown = [...terms].sort((a,b) => a.df - b.df);
  const dots = shown.map((t,i) => {
    const x = X(t.df), y = Y(t.idf);
    const show = i === 0 || i === shown.length - 1;
    return `<circle class="mark" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6"/>` +
      (show ? `<text class="marklbl" x="${Math.min(x+6, W-R-58).toFixed(1)}"
         y="${(y + (i===0?-7:14)).toFixed(1)}">${esc(t.term)}</text>` : '');
  }).join('');
  const rare = shown[0], common = shown[shown.length-1];
  return figShell(HUE.bm25, 'Rare words count for more',
    'log(1 + (N &minus; df) / df)&nbsp;&nbsp;roughly',
    `${axes()}<path class="curve" d="${path(curve)}"/>${dots}
     <text class="tick" x="${L}" y="${H-10}">in 1 doc</text>
     <text class="tick" x="${W-R}" y="${H-10}" text-anchor="end">in all ${fmtK(numDocs)}</text>
     <text class="tick" x="4" y="${T+8}">high</text><text class="tick" x="4" y="${H-B}">low</text>`,
    shown.length === 1
      ? `<b>${esc(rare.term)}</b> appears in ${fmtK(rare.df)} of ${fmtK(numDocs)} documents.
         The fewer documents share a word, the more a match on it counts.`
      : `<b>${esc(rare.term)}</b> appears in ${fmtK(rare.df)} documents and counts
         ${fmtRatio(rare.idf / Math.max(common.idf, 0.01))} as much as
         <b>${esc(common.term)}</b>, which is in ${fmtK(common.df)}.`);
}

/* BM25's per-term share: tf / (tf + k1 × (1 − b + b × len/avg)), which tends to 1 as
   tf grows. Length is not a separate factor: it scales k1 inside the same fraction. */
const bm25Tf = (tf, len, k1, b) => tf / (tf + k1 * (1 - b + b * len));

/* Why the tenth occurrence of a word barely helps. */
function figSaturation(k1, b) {
  const f = tf => bm25Tf(tf, 1, k1, b), g = tf => bm25Tf(tf, 2, k1, b);
  const curve = [], long = [];
  for (let tf = 0; tf <= 12; tf += 0.25) {
    curve.push([px(tf/12), py(f(tf))]);
    long.push([px(tf/12), py(g(tf))]);
  }
  // Plain counting, scaled to agree with BM25 at one mention, until it leaves the chart.
  const end = Math.min(12, 1 / f(1));
  const linear = [[px(0), py(0)], [px(end/12), py(end * f(1))]];
  const up = (a, z) => ((f(z) / f(a) - 1) * 100).toFixed(0);
  return figShell(HUE.bm25, 'More mentions stop helping',
    `tf / (tf + k1 &times; &hellip;)&nbsp;&nbsp;k1 = ${k1}`,
    `${axes()}<path class="ghost" d="${path(linear)}"/>
     <path class="curve" d="${path(long)}" opacity="0.4"/>
     <path class="curve" d="${path(curve)}"/>
     <circle class="mark" cx="${px(1/12)}" cy="${py(f(1))}" r="3.4"/>
     <circle class="mark" cx="${px(10/12)}" cy="${py(f(10))}" r="3.4"/>
     <text class="tick" x="${px(12/12)}" y="${py(g(12)) + 13}" text-anchor="end">2&times; average length</text>
     <text class="tick" x="4" y="${T+8}">idf</text><text class="tick" x="4" y="${H-B}">0</text>
     <text class="tick" x="${L}" y="${H-10}">0</text>
     <text class="tick" x="${W-R}" y="${H-10}" text-anchor="end">12 mentions</text>`,
    `In a document of average length, a 2nd mention raises the term's score by
     <b>${up(1, 2)}%</b>, an 11th by <b>${up(10, 11)}%</b>. It can never pass the term's
     idf. The dashed line is what plain counting would do.`);
}

/* Why a long document does not win just by being long. */
function figLength(k1, b) {
  const rel = len => bm25Tf(1, len, k1, b) / bm25Tf(1, 1, k1, b);
  const lo = 0.25, hi = 3, top = rel(lo);
  const X = len => px((len - lo) / (hi - lo)), Y = v => py(v / top);
  const curve = [];
  for (let len = lo; len <= hi + 1e-9; len += 0.05) curve.push([X(len), Y(rel(len))]);
  return figShell(HUE.bm25, 'Long documents are held back',
    `k1 &times; (1 &minus; b + b &times; len/avg)&nbsp;&nbsp;b = ${b}`,
    `${axes()}<path class="curve" d="${path(curve)}"/>
     <path class="ghost" d="${path([[X(1), T], [X(1), H-B]])}"/>
     <circle class="mark" cx="${X(2).toFixed(1)}" cy="${Y(rel(2)).toFixed(1)}" r="3.4"/>
     <text class="tick" x="${X(1)+4}" y="${T+10}">average</text>
     <text class="tick" x="${L}" y="${H-10}">short</text>
     <text class="tick" x="${W-R}" y="${H-10}" text-anchor="end">3&times; average</text>`,
    `A longer document makes k1 bigger, so each mention earns less. With one mention, a
     document twice the average length scores <b>${(rel(2)*100).toFixed(0)}%</b> of what an
     average one does. At b = 0 length would not matter at all.`);
}

/* What a cosine score actually measures. */
function figCosine(score) {
  // Lucene's COSINE similarity reports (1 + cos) / 2, so scores sit in 0..1.
  const cos = Math.max(-1, Math.min(1, 2 * score - 1));
  const th = Math.acos(cos);
  const ox = 60, oy = H - B - 6, len = 78;
  const ax = ox + len, ay = oy;
  const bx = ox + len * Math.cos(th), by = oy - len * Math.sin(th);
  const arc = `M${ox+26} ${oy} A26 26 0 0 0 ${ox+26*Math.cos(th)} ${oy-26*Math.sin(th)}`;
  return figShell(HUE.dense, 'Similar means pointing the same way',
    'score = (1 + cos angle) / 2',
    `<path d="M${ox} ${oy}L${ax} ${ay}" stroke="var(--mute)" stroke-width="2.2" stroke-linecap="round"/>
     <path d="M${ox} ${oy}L${bx.toFixed(1)} ${by.toFixed(1)}" stroke="var(--c)" stroke-width="2.6" stroke-linecap="round"/>
     <path d="${arc}" fill="none" stroke="var(--rule)" stroke-width="1.4"/>
     <circle cx="${ox}" cy="${oy}" r="3" fill="var(--paper)"/>
     <text class="tick" x="${ax+6}" y="${ay+4}">your words</text>
     <text class="tick" x="${(bx+8).toFixed(1)}" y="${(by-2).toFixed(1)}">a document</text>
     <text class="marklbl" x="${ox+32}" y="${oy-10}">${(th*180/Math.PI).toFixed(0)}&deg;</text>`,
    `Direction is all that counts, not length. The top document scores
     <b>${score.toFixed(3)}</b>: a cosine of ${cos.toFixed(3)}, ${(th*180/Math.PI).toFixed(0)}&deg;
     away from the query.`);
}

/* Why fusion can use ranks and ignore scores entirely. */
function figRrf(k, marks, bm25Top, denseTop) {
  const f = r => 1 / (k + r);
  const shown = marks.filter(m => m.rank);
  const last = Math.max(60, ...shown.map(m => m.rank));
  const X = r => px((r - 1) / (last - 1)), Y = r => py(f(r) / f(1));
  const curve = [];
  for (let r = 1; r <= last; r++) curve.push([X(r), Y(r)]);
  // First label above the curve, second below, so two nearby dots do not collide.
  const dots = shown.map((m, i) =>
    `<circle cx="${X(m.rank).toFixed(1)}" cy="${Y(m.rank).toFixed(1)}" r="3.8" fill="${m.hue}"/>
     <text class="marklbl" x="${Math.min(X(m.rank)+6, W-R-70).toFixed(1)}"
       y="${(Y(m.rank) + (i ? 16 : -7)).toFixed(1)}" fill="${m.hue}">${m.name} #${m.rank}</text>`).join('');
  const scales = bm25Top != null && denseTop != null
    ? `The top BM25 score here is <b>${Number(bm25Top).toFixed(2)}</b> and the top vector
       score <b>${Number(denseTop).toFixed(3)}</b>: different scales, so they cannot be added.`
    : `Scores from different retrievers are on different scales and cannot be added.`;
  return figShell(HUE.rrf, 'Only the position matters',
    `1 / (k + rank)&nbsp;&nbsp;k = ${k}`,
    `${axes()}<path class="curve" d="${path(curve)}"/>${dots}
     <text class="tick" x="${L}" y="${H-10}">1st</text>
     <text class="tick" x="${W-R}" y="${H-10}" text-anchor="end">${last}th</text>`,
    `${scales} Positions can. The dots are where the fused #1 sat in each list. Being 2nd
     in both (<b>${(2*f(2)).toFixed(4)}</b>) beats 1st in one and missing from the other
     (<b>${f(1).toFixed(4)}</b>).`);
}

/* Why one of these can be precomputed and the other cannot. */
function figEncoders() {
  const chip = (x,y,w,lbl) => `<rect x="${x}" y="${y}" width="${w}" height="15" rx="7.5"
      fill="var(--rule)"/><text class="tick" x="${x+w/2}" y="${y+10.5}"
      text-anchor="middle">${lbl}</text>`;
  const box = (x,y,w,lbl,hue) => `<rect x="${x}" y="${y}" width="${w}" height="22" rx="3"
      fill="none" stroke="${hue}" stroke-width="1.8"/>
      <text class="tick" x="${x+w/2}" y="${y+14.5}" text-anchor="middle" fill="${hue}">${lbl}</text>`;
  const M = 'var(--mute)', C = 'var(--c)';
  return figShell(HUE.rerank, 'Two ways to compare two texts',
    'one can be done in advance, the other cannot',
    `<text class="tick" x="6" y="11" fill="${M}">bi-encoder &mdash; retrieval</text>
     ${chip(6,20,64,'query')}${chip(78,20,78,'document')}
     <path d="M38 35v9M117 35v9" stroke="${M}" stroke-width="1.4"/>
     ${box(6,44,64,'model',M)}${box(78,44,78,'model',M)}
     <path d="M38 66v9M117 66v9" stroke="${M}" stroke-width="1.4"/>
     ${chip(6,75,64,'vector')}${chip(78,75,78,'vector')}
     <path d="M38 90v10h79V90" fill="none" stroke="${M}" stroke-width="1.4"/>
     <text class="tick" x="77" y="116" text-anchor="middle" fill="${M}">compare the two</text>

     <path d="M196 6v126" stroke="var(--rule)" stroke-width="1"/>
     <text class="tick" x="212" y="11" fill="${C}">cross-encoder &mdash; rerank</text>
     ${chip(212,20,64,'query')}${chip(284,20,78,'document')}
     <path d="M244 35v9M323 35v9" stroke="${C}" stroke-width="1.4"/>
     ${box(212,44,150,'one model, both texts',C)}
     <path d="M287 66v16" fill="none" stroke="${C}" stroke-width="1.4"/>
     <text class="tick" x="287" y="94" text-anchor="middle" fill="${C}">one relevance score</text>`,
    `The left half embeds every document once, in advance, and only the query is new at
     search time. The right half has to run the model again for every query&ndash;document
     pair, so it only ever sees a shortlist.`, true, '0 0 380 134');
}

/* What the evaluation number is actually counting. */
function figNdcg(hits) {
  const bars = [];
  for (let i = 1; i <= 10; i++) {
    const w = 1 / Math.log2(i + 1);
    const bw = (W - L - R) / 10 - 4;
    const x = L + (i-1) * ((W - L - R) / 10) + 2;
    const h = (H - T - B) * w;
    bars.push(`<rect x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${h.toFixed(1)}" rx="1.5" fill="${hits.includes(i)?'var(--c)':'var(--rule)'}"/>`);
  }
  return figShell(HUE.rrf, 'Being right near the top counts more',
    'each position is worth 1 / log2(position + 1)',
    `${bars.join('')}<path class="axis" d="M${L} ${H-B}H${W-R}"/>
     <text class="tick" x="${L}" y="${H-10}">1st</text>
     <text class="tick" x="${W-R}" y="${H-10}" text-anchor="end">10th</text>`,
    !hits.length
      ? `Nothing relevant in the top ten here, so this query scores 0.`
      : hits[0] === 1
        ? `The relevant document is already first, which is the most any ranking can score.`
        : `Moving the relevant document from ${hits[0]} to 1st would be worth
           <b>${(100/(1/Math.log2(hits[0]+1)) - 100).toFixed(0)}%</b> more.`);
}

/* Where the relevant documents ended up in the ranking the last stage produced. */
function relevantPositions() {
  const d = state.last;
  if (!d) return [];
  const order = ['rerank','rrf','dense','bm25'];
  const stage = d.stages.find(x => order.includes(x.name) &&
    x.name === order.find(n => d.stages.some(y => y.name === n)));
  if (!stage) return [];
  return stage.results.map((r,i) => d.docs[r.docId]?.relevance > 0 ? i + 1 : 0)
    .filter(i => i > 0 && i <= 10);
}

function fmtDuration(ms) {
  if (ms < 1000) return `${ms.toFixed(0)} ms`;
  if (ms < 90_000) return `${(ms/1000).toFixed(0)} seconds`;
  if (ms < 5_400_000) return `${(ms/60_000).toFixed(0)} minutes`;
  if (ms < 172_800_000) return `${(ms/3_600_000).toFixed(1)} hours`;
  return `${(ms/86_400_000).toFixed(1)} days`;
}

const fmtRatio = x => (x >= 10 ? x.toFixed(0) : x.toFixed(1)) + '&times;';
const fmtK = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1) + 'k' : String(n);


function render() { state.ch === 0 ? renderIndexing() : renderSearch(); }

/* ══ boot ═══════════════════════════════════════════════════════════════ */
async function boot() {
  try {
    state.health = await (await fetch(`${API}/api/health`)).json();
    drawCommit();
    if (!state.health.nlp?.ok) note('The embedding and reranking models are offline, so only '
      + 'the word-matching half of the pipeline will run.');
  } catch (e) { note('Cannot reach the search service. Is it running on :8080?', true); }

  await Promise.all([
    fetch(`${API}/api/stats`).then(r => r.json()).then(j => state.stats = j).catch(()=>{}),
    fetch(`${API}/api/benchmark`).then(r => r.ok ? r.json() : null).then(j => state.bench = j).catch(()=>{}),
    fetch(`${API}/api/demo-queries`).then(r => r.ok ? r.json() : null)
      .then(j => state.demos = j).catch(()=>{}),
  ]);

  if (!state.q) {
    const first = state.demos?.['semantic-win']?.[0] || state.demos?.['lexical-win']?.[0];
    if (first) state.q = first.text;
  }
  state.docText = state.docText || DEFAULT_DOC;

  const hash = location.hash.slice(1);
  const idx = CHAPTERS.findIndex(c => c.id === hash);
  go(idx >= 0 ? idx : 0);
}

const DEFAULT_DOC = "Reciprocal rank fusion combines several ranked lists without needing "
  + "their scores to be comparable. Each list contributes one over k plus the rank, and the "
  + "sums decide the final ordering.";

/* Deep links: each chapter has a URL, so a slide can point straight at one. */
addEventListener('hashchange', () => {
  const i = CHAPTERS.findIndex(c => c.id === location.hash.slice(1));
  if (i >= 0 && i !== state.ch) go(i);
});

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('q')?.focus(); return; }
  if (typing) return;
  if (e.key === 'ArrowRight') go(state.ch + 1);
  if (e.key === 'ArrowLeft') go(state.ch - 1);
  if (/^[0-5]$/.test(e.key)) go(+e.key);
});

boot();
</script>
