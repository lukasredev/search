<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>How a search engine works</title>
<style>
@font-face { font-family:Plex; src:url(fonts/plex-sans-400.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:Plex; src:url(fonts/plex-sans-600.woff2) format('woff2');
             font-weight:600; font-display:swap; }
@font-face { font-family:PlexMono; src:url(fonts/plex-mono-400.woff2) format('woff2');
             font-weight:400; font-display:swap; }
@font-face { font-family:PlexMono; src:url(fonts/plex-mono-500.woff2) format('woff2');
             font-weight:500; font-display:swap; }

:root {
  --ink:#0E1420; --slab:#151C2A; --slab2:#1C2537; --rule:#273349;
  --paper:#E9EDF6; --mute:#909CB4;
  --lex:#5B9CFF; --sem:#C07BFF; --fuse:#3FD3A3; --rank:#FFB454;
  --sans:Plex,ui-sans-serif,system-ui,sans-serif;
  --mono:PlexMono,ui-monospace,Menlo,monospace;
  --pad:22px;
}
* { box-sizing:border-box; }
html,body { background:var(--ink); color:var(--paper); margin:0; }
body { font:400 16px/1.55 var(--sans); -webkit-font-smoothing:antialiased; }
.mono { font-family:var(--mono); font-feature-settings:"tnum" 1; }
h1,h2,h3 { margin:0; font-weight:600; letter-spacing:-0.01em; }
button,input,textarea,select { font:inherit; color:inherit; }
:focus-visible { outline:2px solid var(--lex); outline-offset:2px; }
@media (prefers-reduced-motion:reduce) { * { transition:none!important; animation:none!important; } }

/* ── pipeline rail: the table of contents and the architecture diagram at once ── */
.rail { display:flex; align-items:stretch; gap:0; border-bottom:1px solid var(--rule);
        background:var(--slab); position:sticky; top:0; z-index:20; }
.ch { flex:1; display:flex; flex-direction:column; gap:3px; padding:11px 16px 12px;
      background:none; border:0; border-bottom:3px solid transparent; cursor:pointer;
      text-align:left; transition:background .12s; min-width:0; }
.ch:hover { background:var(--slab2); }
.ch .num { font-family:var(--mono); font-size:11.5px; color:var(--mute); }
.ch .nm  { font-size:14.5px; font-weight:600; color:var(--mute); white-space:nowrap;
           overflow:hidden; text-overflow:ellipsis; }
.ch[data-state=done] .nm { color:var(--paper); }
.ch[data-state=done] .num,.ch[data-state=now] .num { color:var(--c); }
.ch[data-state=done] { border-bottom-color:color-mix(in srgb,var(--c) 45%,transparent); }
.ch[data-state=now] { background:var(--slab2); border-bottom-color:var(--c); }
.ch[data-state=now] .nm { color:var(--c); }
.railend { display:flex; align-items:center; gap:14px; padding:0 18px; border-left:1px solid var(--rule);
           font-size:12.5px; color:var(--mute); white-space:nowrap; }

main { padding:26px var(--pad) 90px; max-width:1860px; margin:0 auto; }

/* ── chapter heading ── */
.lede { margin-bottom:22px; max-width:68ch; }
.lede h1 { font-size:31px; line-height:1.18; margin-bottom:7px; }
.lede p { margin:0; color:var(--mute); font-size:17px; line-height:1.5; }

/* ── panels ── */
.panel { background:var(--slab); border:1px solid var(--rule); border-radius:4px;
         padding:var(--pad); margin-bottom:16px; }
.panel > h2 { font-size:17px; margin-bottom:4px; }
.panel > .sub { color:var(--mute); font-size:14px; margin:0 0 16px; max-width:76ch; }
.panel.flush { padding:0; overflow:hidden; }

.grid2 { display:grid; grid-template-columns:minmax(0,420px) minmax(0,1fr); gap:16px;
         align-items:start; }
@media (max-width:1100px) { .grid2 { grid-template-columns:1fr; } }

/* ── controls ── */
.ask { display:flex; gap:10px; margin-bottom:12px; }
.ask input { flex:1; padding:14px 16px; font-size:19px; background:var(--slab);
             border:1px solid var(--rule); border-radius:4px; }
.ask input::placeholder { color:var(--mute); }
.btn { padding:0 22px; font-size:16px; font-weight:600; background:var(--lex); color:#06101F;
       border:0; border-radius:4px; cursor:pointer; }
.btn:disabled { opacity:.45; cursor:default; }
.btn.quiet { background:transparent; color:var(--mute); border:1px solid var(--rule);
             font-weight:400; font-size:14px; padding:7px 13px; }
.btn.quiet:hover { color:var(--paper); border-color:var(--mute); }

.knobs { display:flex; gap:7px 20px; flex-wrap:wrap; align-items:center;
         padding:11px 15px; background:var(--slab); border:1px solid var(--rule);
         border-radius:4px; margin-bottom:16px; font-size:14px; }
.knob { display:flex; gap:7px; align-items:center; color:var(--mute); }
.knob b { color:var(--paper); font-weight:600; }
.knob input,.knob select { width:72px; padding:4px 7px; background:var(--ink);
       border:1px solid var(--rule); border-radius:3px; font-size:14px; font-family:var(--mono); }
.knob select { width:auto; font-family:var(--sans); }
.knob[data-stage] b { color:var(--c); }

/* ── examples ── */
.exrow { display:flex; gap:8px; align-items:flex-start; margin-bottom:7px; }
.exrow .cat { flex:0 0 112px; font-size:13px; color:var(--mute); padding-top:6px; }
.chip { background:var(--slab); border:1px solid var(--rule); border-radius:3px;
        padding:5px 12px; font-size:14px; cursor:pointer; max-width:430px;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip:hover { border-color:var(--c,var(--lex)); color:var(--c,var(--lex)); }

/* ── latency ── */
.bar { display:grid; grid-template-columns:104px 1fr 92px; gap:12px; align-items:center;
       margin-bottom:7px; font-size:14px; }
.bar .track { background:var(--ink); border-radius:2px; height:22px; overflow:hidden; }
.bar .fill { display:block; height:100%; border-radius:2px; min-width:2px; }
.bar .num { text-align:right; color:var(--mute); }

/* ── analyzer chain ── */
.chainrow { display:grid; grid-template-columns:184px 1fr; gap:14px; align-items:baseline;
            padding:4px 0; border-top:1px solid var(--rule); }
.chainrow:first-child { border-top:0; }
.chainrow .f { color:var(--mute); font-size:13.5px; }
.tok { display:inline-block; padding:2px 9px; margin:2px 4px 2px 0; border-radius:3px;
       background:var(--slab2); font-family:var(--mono); font-size:13.5px; }
.tok.gone { opacity:.32; text-decoration:line-through; }
.tok.new { background:color-mix(in srgb,var(--fuse) 22%,var(--slab2)); }

/* ── tables ── */
table { width:100%; border-collapse:collapse; font-size:14px; }
th,td { text-align:right; padding:7px 11px; border-bottom:1px solid var(--rule); }
th:first-child,td:first-child { text-align:left; }
th { color:var(--mute); font-weight:400; font-size:13px; }
tbody tr:hover { background:var(--slab2); }
td.best { color:var(--fuse); font-weight:600; }
.scroll { overflow-x:auto; }

/* ── stage columns ── */
.board { display:grid; gap:14px; align-items:start; }
.col { min-width:0; }
.colhead { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
           padding:0 2px 8px; border-bottom:2px solid var(--c); margin-bottom:9px; }
.colhead .n { font-size:15px; font-weight:600; color:var(--c); }
.colhead .t { font-size:13px; color:var(--mute); font-family:var(--mono); }
.doc { background:var(--ink); border:1px solid var(--rule); border-left:3px solid transparent;
       border-radius:3px; padding:8px 11px; margin-bottom:7px; cursor:pointer; }
.doc:hover { border-color:var(--c); }
.doc.rel { background:var(--slab2); border-left-color:var(--paper); }
.doc .top { display:flex; justify-content:space-between; gap:9px; font-size:12.5px;
            color:var(--mute); margin-bottom:3px; font-family:var(--mono); }
.doc .ttl { font-size:14px; line-height:1.38; overflow:hidden; display:-webkit-box;
            -webkit-line-clamp:3; -webkit-box-orient:vertical; }
.doc.rel .ttl::after { content:" ✓"; color:var(--paper); font-weight:600; }
.sc { color:var(--paper); }
.delta { font-weight:600; }
.delta.up { color:var(--fuse); } .delta.down { color:var(--rank); }
.tag { font-size:11px; padding:1px 5px; border-radius:2px; border:1px solid var(--rule);
       color:var(--mute); margin-left:5px; font-family:var(--sans); }

/* ── vector strip ── */
.vec { display:flex; align-items:center; gap:1px; height:76px; background:var(--ink);
       border:1px solid var(--rule); border-radius:3px; padding:6px 8px; overflow:hidden; }
.vec i { flex:1 1 0; min-width:0; display:block; border-radius:1px; }

.note { color:var(--mute); font-size:13.5px; margin-top:11px; max-width:80ch; }
.banner { background:var(--slab2); border:1px solid var(--rule); border-left:3px solid var(--rank);
          padding:11px 15px; border-radius:3px; font-size:14.5px; margin-bottom:16px; }
.banner.bad { border-left-color:#FF6B6B; }
pre { background:var(--ink); border:1px solid var(--rule); border-radius:3px; padding:13px;
      overflow:auto; font-size:13px; font-family:var(--mono); max-height:440px; margin:0; }
details > summary { cursor:pointer; color:var(--mute); font-size:14px; padding:4px 0; }
textarea { width:100%; min-height:168px; padding:13px; background:var(--ink);
           border:1px solid var(--rule); border-radius:3px; font-family:var(--mono);
           font-size:14px; line-height:1.5; resize:vertical; }
.kv { display:flex; flex-wrap:wrap; gap:4px 30px; font-size:14px; }
.kv div { display:flex; gap:8px; }
.kv span { color:var(--mute); }
.kv b { font-family:var(--mono); font-weight:500; }
.keys { position:fixed; right:14px; bottom:12px; font-size:12px; color:var(--mute);
        background:var(--slab); border:1px solid var(--rule); border-radius:3px;
        padding:5px 11px; font-family:var(--mono); }
</style>
</head>
<body>

<nav class="rail" id="rail"></nav>

<main>
  <div class="lede"><h1 id="chTitle"></h1><p id="chThesis"></p></div>
  <div id="msg"></div>
  <div id="stage"></div>
</main>

<div class="keys">← → chapters &nbsp; 0-5 jump &nbsp; / search</div>

<script>
const API = location.port === '5173' ? 'http://localhost:8080' : '';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HUE = { bm25:'var(--lex)', dense:'var(--sem)', rrf:'var(--fuse)', rerank:'var(--rank)',
              analyze:'var(--mute)' };
const TITLE = { bm25:'BM25', dense:'Dense', rrf:'RRF fusion', rerank:'Cross-encoder' };

/* Each chapter runs the request it describes, so its latency bar is honest:
   chapter 1 really does only BM25 and really does take 2 ms. */
const CHAPTERS = [
  { id:'index', name:'Indexing', hue:'var(--mute)',
    title:'How one document gets into the index',
    thesis:'Before anything can be found it has to be stored twice — once as words, once as '
         + 'numbers. Paste any text below and watch both happen.' },
  { id:'lexical', name:'Matching words', hue:'var(--lex)',
    title:'Looking the words up',
    thesis:'The query goes through the same filters the documents did. Whatever survives is '
         + 'looked up in the inverted index, and BM25 ranks what comes back.',
    req:{ mode:'bm25_only', rerank:false }, cols:['bm25'], knobs:['k1','b','n'] },
  { id:'semantic', name:'Matching meaning', hue:'var(--sem)',
    title:'Words are not meanings',
    thesis:'Ask the same thing in different words and BM25 has nothing to match. A second '
         + 'index stores each document as a point in space, and we look for near ones.',
    req:{ mode:'hybrid', rerank:false }, cols:['bm25','dense'], knobs:['k1','b','n','ef_search'] },
  { id:'fusion', name:'Combining', hue:'var(--fuse)',
    title:'Two rankings, one answer',
    thesis:'BM25 scores and cosine similarities are not comparable numbers. Ranks are. '
         + 'Reciprocal rank fusion adds up 1/(k+rank) and needs nothing else.',
    req:{ mode:'hybrid', rerank:false }, cols:['bm25','dense','rrf'],
    knobs:['k1','b','n','ef_search','rrf_k'] },
  { id:'rerank', name:'Reading closely', hue:'var(--rank)',
    title:'Reading costs more than matching',
    thesis:'A cross-encoder reads the query and document together instead of comparing two '
         + 'vectors. It is better and it is thousands of times slower, so it only ever sees '
         + 'the few dozen candidates the earlier stages hand it.',
    req:{ mode:'hybrid', rerank:true }, cols:['bm25','dense','rrf','rerank'],
    knobs:['k1','b','n','ef_search','rrf_k','rerank_n'] },
  { id:'evidence', name:'Was it worth it?', hue:'var(--paper)',
    title:'Measuring whether each stage earned its place',
    thesis:'Every stage is a hypothesis. These are real relevance judgments, so we can score '
         + 'the ranking after each one and find out which stages actually helped.',
    req:{ mode:'hybrid', rerank:true }, cols:['bm25','dense','rrf','rerank'],
    knobs:['k1','b','n','ef_search','rrf_k','rerank_n'] },
];

const state = {
  ch: 0, health:null, last:null, demos:null, stats:null, busy:false,
  q:'', knob:{ k1:1.2, b:0.75, n:100, ef_search:100, rrf_k:60, rerank_n:50 },
  docText:'', preview:null,
};

/* ══ chrome ══════════════════════════════════════════════════════════════ */
function drawRail() {
  $('rail').innerHTML = CHAPTERS.map((c,i) => {
    const st = i === state.ch ? 'now' : i < state.ch ? 'done' : 'todo';
    return `<button class="ch" data-i="${i}" data-state="${st}" style="--c:${c.hue}">
      <span class="num">${i}</span><span class="nm">${esc(c.name)}</span></button>`;
  }).join('') + `<div class="railend" id="railend"></div>`;
  document.querySelectorAll('.ch').forEach(b => b.onclick = () => go(+b.dataset.i));
  drawRailEnd();
}
function drawRailEnd() {
  const h = state.health;
  const bits = h
    ? [`${h.docs.toLocaleString()} documents`, h.dataset, h.nlp?.ok ? '' : 'models offline']
    : ['connecting'];
  $('railend').innerHTML = bits.filter(Boolean).map(esc).join(' &nbsp; ');
}
function note(text, bad) {
  $('msg').innerHTML = `<div class="banner${bad?' bad':''}">${esc(text)}</div>`;
}

function go(i) {
  state.ch = Math.max(0, Math.min(CHAPTERS.length - 1, i));
  history.replaceState(null, '', `#${CHAPTERS[state.ch].id}`);
  drawRail();
  const c = CHAPTERS[state.ch];
  $('chTitle').textContent = c.title;
  $('chThesis').textContent = c.thesis;
  $('msg').innerHTML = '';
  render();
  if (state.ch > 0 && state.q) search();
}

/* ══ chapter 0: indexing ════════════════════════════════════════════════ */
function renderIndexing() {
  const p = state.preview;
  $('stage').innerHTML = `
    <div class="grid2">
      <div class="panel">
        <h2>The document</h2>
        <p class="sub">Anything you type here is run through the real analyzer and the real
          embedding model. Nothing is written to the index.</p>
        <textarea id="docText" spellcheck="false">${esc(state.docText)}</textarea>
        <div style="display:flex;gap:9px;margin-top:11px">
          <button class="btn" id="doIndex">Index it</button>
          <button class="btn quiet" id="loadDoc">Load one from the corpus</button>
        </div>
      </div>
      <div id="idxOut">${p ? '' : `<div class="panel"><p class="sub" style="margin:0">
        Press <b>Index it</b> to follow the document through.</p></div>`}</div>
    </div>
    ${statsPanel()}`;

  $('doIndex').onclick = runPreview;
  $('loadDoc').onclick = loadCorpusDoc;
  $('docText').oninput = e => state.docText = e.target.value;
  if (p) drawPreview(p);
}

async function runPreview() {
  const text = $('docText').value.trim();
  if (!text) return;
  state.docText = text;
  $('doIndex').disabled = true;
  try {
    const r = await fetch(`${API}/api/index-preview?text=${encodeURIComponent(text)}`);
    state.preview = await r.json();
    drawPreview(state.preview);
  } catch (e) { note('Could not reach the index: ' + e.message, true); }
  finally { $('doIndex').disabled = false; }
}

function drawPreview(p) {
  const s = p.summary;
  const chain = p.analyzer.chain.map((step,i) => {
    const prev = i ? p.analyzer.chain[i-1].tokens : null;
    const toks = step.tokens.map(t => `<span class="tok">${esc(t)}</span>`).join('');
    const gone = prev ? prev.filter(x => !step.tokens.includes(x) && !stemmedFrom(x, step.tokens))
      .map(t => `<span class="tok gone">${esc(t)}</span>`).join('') : '';
    return `<div class="chainrow"><span class="f mono">${esc(step.filter)}</span>
            <span>${toks}${gone}</span></div>`;
  }).join('');

  const rows = p.postings.slice(0, 18).map(t => `<tr>
      <td class="mono">${esc(t.term)}${t.df === 0 ? '<span class="tag">new term</span>' : ''}</td>
      <td class="mono">${t.tf}</td>
      <td class="mono" style="color:var(--mute)">${t.positions.slice(0,8).join(' ')}${
        t.positions.length > 8 ? ' …' : ''}</td>
      <td class="mono">${t.df.toLocaleString()}</td>
      <td class="mono">${t.idf}</td></tr>`).join('');

  const v = p.vector;
  const vecHtml = v && v.values ? `
    <div class="vec">${v.values.map(x => {
      const h = Math.min(100, Math.abs(x) * 420);
      return `<i style="height:${h}%;background:${x >= 0 ? 'var(--rank)' : 'var(--lex)'};
              opacity:${0.35 + Math.min(0.65, Math.abs(x) * 5)}"></i>`;
    }).join('')}</div>
    <div class="kv" style="margin-top:11px">
      <div><span>model</span><b>${esc(v.model.split('/').pop())}</b></div>
      <div><span>dimensions</span><b>${v.dim}</b></div>
      <div><span>length</span><b>${v.norm}</b></div>
      <div><span>size</span><b>${v.bytes} bytes</b></div>
      <div><span>computed in</span><b>${v.ms} ms</b></div>
    </div>
    <p class="note">Every document in the index is one of these. Searching by meaning means
      finding the ones whose arrows point the same way as the query's — which is why the
      length is always 1: only direction carries meaning.</p>`
    : `<p class="sub">The embedding model is not reachable, so only the word half ran.</p>`;

  $('idxOut').innerHTML = `
    <div class="panel">
      <h2>1 &nbsp;Split it into terms</h2>
      <p class="sub">Each filter rewrites the token stream. Only what survives all five is
        ever searchable — which is why a search for “deficiencies” finds “deficiency”.</p>
      ${chain}
    </div>
    <div class="panel">
      <h2>2 &nbsp;Write it into the postings</h2>
      <p class="sub">One row per distinct term. Each one appends this document to that term's
        posting list, with the positions it appeared at. <b>df</b> is how many documents
        already contain the term — the whole basis of BM25's idea that rare words matter more.</p>
      <div class="scroll"><table>
        <thead><tr><th>term</th><th>times here</th><th>at positions</th>
          <th>documents already</th><th>idf</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
      ${p.postings.length > 18 ? `<p class="note">${p.postings.length - 18} more terms not shown.</p>` : ''}
      <div class="kv" style="margin-top:14px">
        <div><span>tokens</span><b>${s.tokensProduced}</b></div>
        <div><span>distinct terms</span><b>${s.uniqueTerms}</b></div>
        <div><span>never seen before</span><b>${s.termsNewToThisIndex}</b></div>
        <div><span>index size</span><b>${s.docsInIndex.toLocaleString()} docs</b></div>
      </div>
    </div>
    <div class="panel">
      <h2>3 &nbsp;Turn it into a point in space</h2>
      <p class="sub">The same text, read by a neural network and squeezed into
        ${v?.dim ?? 384} numbers — one bar each, height for size and colour for sign. No single
        bar means anything on its own; only the whole pattern does.</p>
      ${vecHtml}
    </div>`;
}

function stemmedFrom(word, tokens) {
  return tokens.some(t => word.toLowerCase().startsWith(t.slice(0, Math.max(3, t.length - 2))));
}

function statsPanel() {
  const s = state.stats;
  if (!s || !s.bytesByComponent) return '';
  const parts = Object.entries(s.bytesByComponent).filter(([,b]) => b > 1000)
    .sort((a,b) => b[1] - a[1]);
  const max = parts[0][1];
  return `<div class="panel">
    <h2>What the finished index costs</h2>
    <p class="sub">${s.docs.toLocaleString()} documents and ${s.uniqueTerms.toLocaleString()}
      distinct terms, on disk. The word index is the cheap half.</p>
    ${parts.map(([k,b]) => `<div class="bar">
      <span>${esc(k)}</span>
      <span class="track"><span class="fill" style="width:${100*b/max}%;background:${
        k.includes('hnsw') ? 'var(--sem)' : k.includes('inverted') ? 'var(--lex)' : 'var(--rule)'
      }"></span></span>
      <span class="num mono">${(b/1e6).toFixed(1)} MB</span></div>`).join('')}
  </div>`;
}

async function loadCorpusDoc() {
  try {
    const qs = await (await fetch(`${API}/api/queries?limit=80`)).json();
    const pick = qs.queries[Math.floor(Math.random() * qs.queries.length)];
    const r = await (await fetch(
      `${API}/api/search?mode=bm25_only&rerank=false&explain=false&bm25_n=1&q=${
        encodeURIComponent(pick.text)}`)).json();
    const id = r.stages.find(s => s.name === 'bm25')?.results?.[0]?.docId;
    if (!id) return;
    const doc = await (await fetch(`${API}/api/doc/${encodeURIComponent(id)}`)).json();
    state.docText = [doc.title, doc.text].filter(Boolean).join('\n\n');
    $('docText').value = state.docText;
    runPreview();
  } catch (e) { note('Could not load a document: ' + e.message, true); }
}

/* ══ chapters 1-5: searching ════════════════════════════════════════════ */
function renderSearch() {
  const c = CHAPTERS[state.ch];
  $('stage').innerHTML = `
    <div class="ask">
      <input id="q" type="text" value="${esc(state.q)}" spellcheck="false"
             placeholder="Ask something, or pick an example below">
      <button class="btn" id="go">Search</button>
    </div>
    <div id="examples"></div>
    ${knobsHtml(c)}
    <div id="results"></div>`;

  $('go').onclick = search;
  $('q').onkeydown = e => { if (e.key === 'Enter') { state.q = $('q').value; search(); } };
  $('q').oninput = e => state.q = e.target.value;
  c.knobs.forEach(k => {
    const el = $('k_' + k);
    if (el) el.onchange = () => { state.knob[k] = el.value; if (state.last) search(); };
  });
  drawExamples();
  if (state.last) drawResults();
}

const KNOB_META = {
  k1:{ label:'k1', stage:'bm25', step:0.1, hint:'how fast repeated words stop helping' },
  b:{ label:'b', stage:'bm25', step:0.05, hint:'how much document length is penalised' },
  n:{ label:'candidates', stage:null, step:10 },
  ef_search:{ label:'efSearch', stage:'dense', step:10, hint:'how wide the graph walk is' },
  rrf_k:{ label:'k', stage:'rrf', step:10, hint:'how much top ranks dominate' },
  rerank_n:{ label:'rerank top', stage:'rerank', step:10 },
};
function knobsHtml(c) {
  return `<div class="knobs">${c.knobs.map(k => {
    const m = KNOB_META[k];
    const hue = m.stage ? HUE[m.stage] : 'var(--paper)';
    return `<span class="knob" ${m.stage?`data-stage="${m.stage}"`:''} style="--c:${hue}"
      ${m.hint?`title="${esc(m.hint)}"`:''}><b>${esc(m.label)}</b>
      <input id="k_${k}" type="number" step="${m.step}" value="${state.knob[k]}"></span>`;
  }).join('')}</div>`;
}

function drawExamples() {
  const d = state.demos;
  if (!d) return;
  const CAT = { 'lexical-win':['words win','var(--lex)'], 'semantic-win':['meaning wins','var(--sem)'],
                'fusion-win':['fusion wins','var(--fuse)'] };
  // Early chapters only show the contrast they can actually explain.
  const show = state.ch <= 1 ? ['lexical-win']
             : state.ch === 2 ? ['lexical-win','semantic-win'] : Object.keys(CAT);
  $('examples').innerHTML = show.filter(k => d[k]?.length).map(k => `
    <div class="exrow"><span class="cat">${CAT[k][0]}</span>
      ${d[k].slice(0,3).map(r => `<span class="chip" style="--c:${CAT[k][1]}"
        data-q="${esc(r.text)}" title="${esc(r.teaches)}">${esc(r.text)}</span>`).join('')}
    </div>`).join('');
  document.querySelectorAll('.chip').forEach(el => el.onclick = () => {
    state.q = el.dataset.q; $('q').value = state.q; search();
  });
}

async function search() {
  const c = CHAPTERS[state.ch];
  state.q = ($('q')?.value || state.q).trim();
  if (!state.q || state.busy) return;
  state.busy = true; $('go').disabled = true; $('msg').innerHTML = '';

  const p = new URLSearchParams({
    q: state.q, mode: c.req.mode, rerank: c.req.rerank,
    k1: state.knob.k1, b: state.knob.b,
    bm25_n: state.knob.n, dense_n: state.knob.n,
    ef_search: state.knob.ef_search, rrf_k: state.knob.rrf_k,
    rerank_n: c.req.rerank ? state.knob.rerank_n : 0,
  });
  try {
    const res = await fetch(`${API}/api/search?${p}`);
    if (!res.ok) throw new Error((await res.text()).slice(0, 200));
    state.last = await res.json();
    if (state.last.warnings) note(state.last.warnings.join(' · '));
    drawResults();
  } catch (e) { note('Search failed: ' + e.message, true); }
  finally { state.busy = false; const g = $('go'); if (g) g.disabled = false; }
}

function drawResults() {
  const d = state.last, c = CHAPTERS[state.ch];
  const st = Object.fromEntries(d.stages.map(s => [s.name, s]));
  const cols = c.cols.filter(n => st[n]?.results?.length);

  const blocks = [analysisPanel(st.analyze, c)];
  if (state.ch >= 4) blocks.push(latencyPanel(d.stages));
  if (state.ch === 5) blocks.push(evalPanel(d.eval));
  blocks.push(boardPanel(cols, st, d, c));
  if (state.ch === 3 && st.rrf) blocks.push(rrfPanel(st.rrf, d));
  if (state.ch === 2 && st.dense) blocks.push(densePanel(st.dense, st.bm25));
  if (state.ch < 4) blocks.push(latencyPanel(d.stages));
  if (state.ch === 5) blocks.push(benchPanel());
  blocks.push(rawPanel(d));

  $('results').innerHTML = blocks.filter(Boolean).join('');
  document.querySelectorAll('.doc').forEach(el =>
    el.onclick = () => showDoc(el.dataset.id, d, st));
}

function analysisPanel(stage, c) {
  if (!stage) return '';
  const terms = stage.detail.terms;
  const last = stage.detail.chain[stage.detail.chain.length - 1];
  return `<div class="panel">
    <h2>What the engine actually searched for</h2>
    <p class="sub">Your words after the same five filters every document went through.
      Rare terms (high idf) do most of the work in BM25.</p>
    <div>${last.tokens.map((t,i) => `<span class="tok">${esc(t)}</span>`).join('')}</div>
    <div class="scroll" style="margin-top:13px"><table>
      <thead><tr><th>term</th><th>documents containing it</th><th>idf</th></tr></thead>
      <tbody>${terms.map(t => `<tr><td class="mono">${esc(t.term)}</td>
        <td class="mono">${t.df.toLocaleString()}</td><td class="mono">${t.idf}</td></tr>`).join('')}
      </tbody></table></div>
    <details style="margin-top:10px"><summary>Every filter, step by step</summary>
      <div style="margin-top:8px">${stage.detail.chain.map(s =>
        `<div class="chainrow"><span class="f mono">${esc(s.filter)}</span>
         <span>${s.tokens.map(t => `<span class="tok">${esc(t)}</span>`).join('')}</span></div>`
      ).join('')}</div></details>
  </div>`;
}

function latencyPanel(stages) {
  const max = Math.max(...stages.map(s => s.ms), 1);
  const total = stages.reduce((a,s) => a + s.ms, 0);
  const slowest = stages.reduce((a,s) => s.ms > a.ms ? s : a);
  return `<div class="panel">
    <h2>Where the time went</h2>
    <p class="sub">${total.toFixed(0)} ms in total, and ${
      (100*slowest.ms/total).toFixed(0)}% of it in <b>${esc(slowest.name)}</b>.</p>
    ${stages.map(s => `<div class="bar">
      <span class="mono">${esc(s.name)}</span>
      <span class="track"><span class="fill" style="width:${Math.max(100*s.ms/max,0.4)}%;
        background:${HUE[s.name] || 'var(--rule)'}"></span></span>
      <span class="num mono">${s.ms} ms</span></div>`).join('')}
    ${state.ch >= 4 ? `<p class="note">The cross-encoder is roughly a thousand times slower
      per document than BM25. Scoring the whole collection with it would take minutes, which
      is the entire reason the earlier stages exist.</p>` : ''}
  </div>`;
}

function boardPanel(cols, st, d, c) {
  const body = cols.map(name => {
    const s = st[name];
    const docs = s.results.slice(0, 12).map(r => docCard(r, d, name)).join('');
    return `<div class="col" style="--c:${HUE[name]}">
      <div class="colhead"><span class="n">${esc(TITLE[name])}</span>
        <span class="t">${s.ms} ms</span></div>${docs}</div>`;
  }).join('');
  const only = st.rrf ? `<p class="note">Of ${st.rrf.detail.uniqueDocs} documents found in
    total, only ${st.rrf.detail.overlap} were found by <em>both</em> retrievers. The rest is
    each one covering for the other's blind spot.</p>` : '';
  const relNote = d.eval?.judged
    ? `<p class="note">Documents marked ✓ are the ones human judges called relevant for this
       query. Watch them climb as stages are added.</p>` : '';
  return `<div class="panel">
    <h2>${cols.length === 1 ? 'What came back' : 'The same query, ranked ' + cols.length + ' ways'}</h2>
    <p class="sub">Top 12 of each. Click any document to see why it scored what it did.</p>
    <div class="board" style="grid-template-columns:repeat(${cols.length},minmax(0,1fr))">${body}</div>
    ${only}${relNote}</div>`;
}

function docCard(r, d, stage) {
  const meta = d.docs[r.docId] || {};
  let right = `<span class="sc">${fmtScore(r.score, stage)}</span>`;
  if (stage === 'rerank' && r.delta) {
    right += ` <span class="delta ${r.delta>0?'up':'down'}">${r.delta>0?'▲':'▼'}${
      Math.abs(r.delta)}</span>`;
  }
  const tags = (stage === 'rrf' && r.foundBy?.length === 1)
      ? `<span class="tag">${esc(r.foundBy[0])} only</span>` : '';
  const trunc = (stage === 'rerank' && r.truncated) ? '<span class="tag">cut at 512</span>' : '';
  return `<div class="doc${meta.relevance>0?' rel':''}" data-id="${esc(r.docId)}">
    <div class="top"><span>${r.rank}${tags}${trunc}</span>${right}</div>
    <div class="ttl">${esc(meta.title || meta.snippet || '')}</div></div>`;
}
const fmtScore = (v, s) => s === 'rrf' ? v.toFixed(5) : s === 'dense' ? v.toFixed(3) : v.toFixed(2);

function densePanel(dense, bm25) {
  const dd = dense.detail;
  const lex = new Set((bm25?.results || []).map(r => r.docId));
  const onlyDense = dense.results.filter(r => !lex.has(r.docId)).length;
  return `<div class="panel">
    <h2>How the vector index found them</h2>
    <p class="sub">It did not read every document. The vectors are wired into a graph, and
      the search walks it greedily towards the query.</p>
    <div class="kv">
      <div><span>vectors visited</span><b>${dd.visitedCount.toLocaleString()}${
        state.health ? ' of ' + state.health.docs.toLocaleString() : ''}</b></div>
      <div><span>that is</span><b>${dd.visitedFraction}%</b></div>
      <div><span>embedding the query</span><b>${dd.embedMs} ms</b></div>
      <div><span>walking the graph</span><b>${dd.graphMs} ms</b></div>
    </div>
    <p class="note">${onlyDense} of these ${dense.results.length} documents were invisible to
      BM25 — no shared term with the query at all. That gap is what the second index is for.</p>
  </div>`;
}

function rrfPanel(rrf, d) {
  const rows = rrf.results.slice(0, 8).map(r => `<tr>
      <td class="mono">${r.rank}</td>
      <td style="max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${
        esc((d.docs[r.docId]||{}).title || r.docId)}</td>
      <td class="mono" style="color:var(--lex)">${r.contrib.bm25 ? r.contrib.bm25.rank : '—'}</td>
      <td class="mono" style="color:var(--sem)">${r.contrib.dense ? r.contrib.dense.rank : '—'}</td>
      <td class="mono" style="color:var(--mute);text-align:left">${esc(r.formula)}</td></tr>`).join('');
  return `<div class="panel">
    <h2>The arithmetic, in full</h2>
    <p class="sub">No score normalisation anywhere. Each list contributes 1/(k+rank), and a
      document that both retrievers liked a bit beats one that only one of them loved.</p>
    <div class="scroll"><table>
      <thead><tr><th>#</th><th>document</th><th>BM25 rank</th><th>dense rank</th>
        <th style="text-align:left">fused score</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </div>`;
}

function evalPanel(ev) {
  if (!ev || !ev.judged) return `<div class="panel"><h2>No judgments for this query</h2>
    <p class="sub" style="margin:0">Pick one of the examples above — those come with human
    relevance judgments, so every stage can be scored.</p></div>`;
  const metrics = ['ndcg@10','recall@10','recall@100','mrr'];
  const names = { 'ndcg@10':'nDCG@10', 'recall@10':'recall@10', 'recall@100':'recall@100', mrr:'MRR' };
  const stages = Object.keys(ev.perStage);
  const best = {};
  metrics.forEach(m => best[m] = Math.max(...stages.map(s => ev.perStage[s][m])));
  return `<div class="panel">
    <h2>Scoring this query after every stage</h2>
    <p class="sub">${ev.relevantTotal} document${ev.relevantTotal===1?' was':'s were'} judged
      relevant. nDCG@10 rewards putting them near the top.</p>
    <table><thead><tr><th>after</th>${metrics.map(m=>`<th>${names[m]}</th>`).join('')}</tr></thead>
    <tbody>${stages.map(s => `<tr><td style="color:${HUE[s]}">${esc(TITLE[s]||s)}</td>
      ${metrics.map(m => `<td class="mono ${ev.perStage[s][m]===best[m]&&best[m]>0?'best':''}">${
        ev.perStage[s][m].toFixed(3)}</td>`).join('')}</tr>`).join('')}
    </tbody></table>
    <p class="note">One query is an anecdote. The table below is all of them.</p>
  </div>`;
}

function benchPanel() {
  const b = state.bench;
  if (!b || !b.perStage) return '';
  const rows = Object.entries(b.perStage).map(([s,m]) => `<tr>
    <td style="color:${HUE[s]}">${esc(TITLE[s]||s)}</td>
    <td class="mono">${(m['ndcg@10']??0).toFixed(3)}</td>
    <td class="mono">${(m['recall@100']??0).toFixed(3)}</td>
    <td class="mono">${(m.mrr??0).toFixed(3)}</td>
    <td class="mono">${m.avgMs} ms</td></tr>`).join('');
  return `<div class="panel">
    <h2>Every judged query in the collection</h2>
    <p class="sub">${b.queries.toLocaleString()} queries, averaged. This is the honest version
      of the table above.</p>
    <table><thead><tr><th>after</th><th>nDCG@10</th><th>recall@100</th><th>MRR</th>
      <th>per query</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

function showDoc(docId, d, st) {
  const meta = d.docs[docId] || {};
  const out = [];
  const bm = st.bm25?.results.find(r => r.docId === docId);
  if (bm?.explain) {
    out.push(`<h2>Why BM25 scored it ${bm.explain.total}</h2>
      <p class="sub">k1 = ${bm.explain.k1}, b = ${bm.explain.b}. Each term contributes
      independently; they simply add up.</p>
      <div class="scroll"><table><thead><tr><th>term</th><th>contributes</th><th>times in doc</th>
      <th>documents with it</th><th>idf</th><th>doc length</th><th>average</th></tr></thead><tbody>
      ${bm.explain.terms.map(t => `<tr><td class="mono">${esc(t.term)}</td>
        <td class="mono" style="color:var(--lex)">${t.contrib}</td><td class="mono">${t.tf ?? '—'}</td>
        <td class="mono">${(t.df ?? 0).toLocaleString()}</td><td class="mono">${t.idf ?? '—'}</td>
        <td class="mono">${t.dl ?? '—'}</td><td class="mono">${t.avgdl ?? '—'}</td></tr>`).join('')}
      </tbody></table></div>`);
  }
  const rr = st.rrf?.results.find(r => r.docId === docId);
  if (rr) out.push(`<p class="note" style="font-size:15px">Fused: <span class="mono">${
    esc(rr.formula)}</span></p>`);
  const rk = st.rerank?.results.find(r => r.docId === docId);
  if (rk) out.push(`<p class="note" style="font-size:15px">Cross-encoder scored it
    <b class="mono">${rk.score}</b> and moved it from ${rk.prevRank} to ${rk.rank}${
    rk.truncated ? `, having read only the first 512 tokens of ${rk.docTokens}` : ''}.</p>`);

  const where = ['bm25','dense','rrf','rerank'].filter(n => st[n]).map(n => {
    const r = st[n].results.find(x => x.docId === docId);
    return `<div><span>${esc(TITLE[n])}</span><b style="color:${HUE[n]}">${r?'#'+r.rank:'not found'}</b></div>`;
  }).join('');

  $('msg').innerHTML = `<div class="panel">
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start">
      <div><h2>${esc(meta.title || docId)}</h2>
        <p class="sub" style="margin:4px 0 0">${esc(docId)}${
          meta.relevance>0 ? ' — judged relevant' : ''}</p></div>
      <button class="btn quiet" onclick="document.getElementById('msg').innerHTML=''">Close</button>
    </div>
    <div class="kv" style="margin:14px 0">${where}</div>
    ${out.join('')}
    <details style="margin-top:12px"><summary>The document</summary>
      <p class="note" style="font-size:14.5px;color:var(--paper)">${esc(meta.snippet||'')}</p></details>
  </div>`;
  $('msg').scrollIntoView({ behavior:'smooth', block:'nearest' });
}

function rawPanel(d) {
  return `<div class="panel">
    <h2>Everything above came from one HTTP response</h2>
    <p class="sub">This page computes nothing of its own. Open the network tab and you will
      find exactly these numbers.</p>
    <details><summary>Show the JSON (${(JSON.stringify(d).length/1024).toFixed(0)} KB)</summary>
      <pre style="margin-top:9px">${esc(JSON.stringify(d, null, 2))}</pre></details>
  </div>`;
}

function render() { state.ch === 0 ? renderIndexing() : renderSearch(); }

/* ══ boot ═══════════════════════════════════════════════════════════════ */
async function boot() {
  try {
    state.health = await (await fetch(`${API}/api/health`)).json();
    if (!state.health.nlp?.ok) note('The embedding and reranking models are offline, so only '
      + 'the word-matching half of the pipeline will run.');
  } catch (e) { note('Cannot reach the search service. Is it running on :8080?', true); }

  await Promise.all([
    fetch(`${API}/api/stats`).then(r => r.json()).then(j => state.stats = j).catch(()=>{}),
    fetch(`${API}/api/benchmark`).then(r => r.ok ? r.json() : null).then(j => state.bench = j).catch(()=>{}),
    fetch(`${API}/api/demo-queries`).then(r => r.ok ? r.json() : null)
      .then(j => state.demos = j).catch(()=>{}),
  ]);

  if (!state.q) {
    const first = state.demos?.['semantic-win']?.[0] || state.demos?.['lexical-win']?.[0];
    if (first) state.q = first.text;
  }
  state.docText = state.docText || DEFAULT_DOC;

  const hash = location.hash.slice(1);
  const idx = CHAPTERS.findIndex(c => c.id === hash);
  go(idx >= 0 ? idx : 0);
}

const DEFAULT_DOC = "Reciprocal rank fusion combines several ranked lists without needing "
  + "their scores to be comparable. Each list contributes one over k plus the rank, and the "
  + "sums decide the final ordering.";

addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);
  if (e.key === '/' && !typing) { e.preventDefault(); $('q')?.focus(); return; }
  if (typing) return;
  if (e.key === 'ArrowRight') go(state.ch + 1);
  if (e.key === 'ArrowLeft') go(state.ch - 1);
  if (/^[0-5]$/.test(e.key)) go(+e.key);
});

boot();
</script>
</body>
</html>
