# Two long-running services, two one-shot setup jobs.
#
#   docker compose --profile setup run --rm fetch quora
#   docker compose --profile setup run --rm indexer quora
#   DATASET=quora docker compose up -d
#
# The datasets, their cached embeddings and the Lucene index all live in one named
# volume, so rebuilding images never costs you a re-index.

name: search-demo

x-dataset: &dataset ${DATASET:-cqadupstack-unix}

services:
  nlp:
    build:
      context: .
      dockerfile: nlp/Dockerfile
      args:
        EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
        RERANK_MODEL: ${RERANK_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
        EMBED_REVISION: ${EMBED_REVISION:-1110a243fdf4706b3f48f1d95db1a4f5529b4d41}
        RERANK_REVISION: ${RERANK_REVISION:-233902d25c440f23af6f7d6e94d2946bac0bee0a}
    image: search-demo/nlp:latest
    environment:
      TORCH_THREADS: ${TORCH_THREADS:-4}
      RERANK_MAX_LEN: 512
    # Not published: only searchd talks to it. Expose it only if you want to poke at
    # /embed yourself during a talk.
    expose: ["8081"]
    restart: unless-stopped
    mem_limit: ${NLP_MEM:-3g}

  searchd:
    build:
      context: .
      dockerfile: searchd/Dockerfile
      # `make docker-build` sets this to the current commit.
      args:
        GIT_SHA: ${GIT_SHA:-}
    image: search-demo/searchd:latest
    depends_on:
      nlp:
        condition: service_healthy
    environment:
      DATASET: *dataset
      NLP_URL: http://nlp:8081
      # Set both to require HTTP basic auth. Leave unset for a local demo.
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
    ports: ["${BIND:-127.0.0.1}:${PORT:-8080}:8080"]
    volumes:
      - data:/data:ro
    restart: unless-stopped
    mem_limit: ${SEARCHD_MEM:-2g}

  # ── setup jobs: run once, then exit ───────────────────────────────────────
  fetch:
    profiles: ["setup"]
    image: python:3.14-slim
    working_dir: /work
    volumes:
      - ./scripts:/work/scripts:ro
      - data:/work/data
    # Runs as root, but the indexer and bench jobs run as the image's unprivileged user
    # (uid 10001, see searchd/Dockerfile) and must write the index and embedding cache.
    entrypoint: ["sh", "-c", "python3 scripts/fetch_dataset.py \"$$@\" && chown -R 10001:10001 data", "fetch"]
    command: ["cqadupstack-unix"]

  indexer:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: searchd/Dockerfile
    image: search-demo/searchd:latest
    depends_on:
      nlp:
        condition: service_healthy
    environment:
      DATASET: *dataset
      NLP_URL: http://nlp:8081
      EMBED_BATCH: ${EMBED_BATCH:-256}
      # Every vector is held on the heap while the HNSW graph is built: 522k Quora
      # vectors are about 800 MB before Lucene sees them.
      INDEX_JAVA_OPTS: ${INDEX_JAVA_OPTS:--Xmx5g}
    volumes:
      - data:/data
    entrypoint: ["entrypoint", "index"]
    command: []
    # The image's health check probes the web server, which a one-off job never starts.
    healthcheck:
      disable: true
    mem_limit: ${INDEX_MEM:-6g}

  bench:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: searchd/Dockerfile
    image: search-demo/searchd:latest
    depends_on:
      nlp:
        condition: service_healthy
    environment:
      DATASET: *dataset
      NLP_URL: http://nlp:8081
    volumes:
      - data:/data
    # run --rm bench <dataset> [maxQueries] [rerank|norerank]
    entrypoint: ["entrypoint", "bench"]
    command: []
    healthcheck:
      disable: true

  demos:
    profiles: ["setup"]
    image: python:3.14-slim
    working_dir: /work
    depends_on:
      searchd:
        condition: service_healthy
    volumes:
      - ./scripts:/work/scripts:ro
      - data:/work/data
    environment:
      AUTH_USER: ${AUTH_USER:-}
      AUTH_PASS: ${AUTH_PASS:-}
    # run --rm demos --dataset quora --topic cs
    entrypoint: ["python3", "scripts/find_demo_queries.py", "--host", "http://searchd:8080"]
    command: []

volumes:
  data:
