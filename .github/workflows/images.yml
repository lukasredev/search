# Runs the unit tests, then builds the two service images and pushes them to the GitHub
# container registry:
#
#   ghcr.io/<owner>/<repo>/searchd
#   ghcr.io/<owner>/<repo>/nlp
#
# Pushes to the default branch publish :latest and :sha-<short>; a v1.2.3 tag publishes
# :1.2.3 and :1.2. Pull requests build both images but push nothing. Nothing is built
# if the tests fail, so a broken commit never becomes :latest.

name: images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `make test`: Java against a fake sidecar and a throwaway index, Python against fake
  # models. Needs neither the real models nor a built index.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: nlp/requirements*.txt

      # The tests import the sidecar, so they need its dependencies, though never its
      # models. The CPU torch wheel spares the runner ~2.5 GB of CUDA, as in nlp/Dockerfile.
      - name: Python environment
        run: |
          python -m venv nlp/.venv
          nlp/.venv/bin/pip install -q --index-url https://download.pytorch.org/whl/cpu \
            "torch==$(sed -n 's/^torch==//p' nlp/requirements.txt)"
          nlp/.venv/bin/pip install -q -r nlp/requirements.txt -r nlp/requirements-dev.txt

      - run: make test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [searchd, nlp]
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation, so the images also run on Apple silicon and
      # Graviton. searchd compiles on the native platform; only nlp pays for QEMU.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
